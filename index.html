<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  /* Phones set to a small "display size" report a wide screen, which makes
     every button tiny. Lay those out at a normal phone width (400) and let
     the browser scale it up to fill the screen. */
  (function () {
    // A phone is a touch screen at least 1.7 times taller than wide (tablets
    // are squarer), however many pixels it claims to have.
    var w = Math.min(screen.width, screen.height), h = Math.max(screen.width, screen.height);
    if (w > 440 && h / w > 1.7 && matchMedia('(pointer: coarse)').matches) {
      document.querySelector('meta[name=viewport]').setAttribute('content', 'width=400, viewport-fit=cover');
    }
  })();
</script>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Reader">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<base target="_top">
<title>Autoscroll Reader</title>
<style>html,body{margin:0;padding:0;height:100%;background:#000;}</style>

<style>
  /* ---------------------------------------------------------------
     Palette. The night theme is the original brass-on-dark; paper is
     its counterpart, with the accent darkened so it still holds
     contrast on a light ground. Neutrals are biased warm toward the
     brass rather than sitting on pure grey.
     --------------------------------------------------------------- */
  [data-theme="night"] {
    --bg: #14110f;
    --panel: #1e1a17;
    --panel-2: #262019;
    --ink: #e8e2d6;
    --muted: #8a8174;
    --line: #2c2722;
    --accent: #d8a657;
    --accent-ink: #1a1714;
    --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
  [data-theme="paper"] {
    --bg: #f7f3ea;
    --panel: #efe8da;
    --panel-2: #e5dccb;
    --ink: #241f19;
    --muted: #6f6455;
    --line: #ded4c1;
    --accent: #8a6212;
    --accent-ink: #fdfaf3;
    --shadow: rgba(60, 46, 24, 0.18);
    color-scheme: light;
  }


  /* More palettes: night-reading darks, warm lights, and a true-black OLED. */
  [data-theme="saffron"] { --bg:#120f1e; --panel:#1e1838; --panel-2:#262046; --ink:#ece3d2; --muted:#b3a488; --line:#332a4d; --accent:#f0a33c; --accent-ink:#1a1206; --shadow:rgba(0,0,0,0.5); color-scheme:dark; }
  [data-theme="parchment"] { --bg:#fbf3e2; --panel:#f3e6cb; --panel-2:#e9d6b0; --ink:#2c2014; --muted:#6b5638; --line:#dcc18a; --accent:#a8380c; --accent-ink:#fff8ec; --shadow:rgba(60,46,24,0.18); color-scheme:light; }
  [data-theme="sepia"] { --bg:#f1e5cf; --panel:#e8d9bd; --panel-2:#dccaa9; --ink:#3b2a1a; --muted:#735c42; --line:#d3bf9c; --accent:#8b4a1c; --accent-ink:#fbf3e4; --shadow:rgba(60,46,24,0.18); color-scheme:light; }
  [data-theme="sky"] { --bg:#eef3f7; --panel:#e2e9f0; --panel-2:#d5dfe9; --ink:#1d2733; --muted:#5a6878; --line:#cfd9e3; --accent:#2c6aa8; --accent-ink:#ffffff; --shadow:rgba(60,46,24,0.18); color-scheme:light; }
  [data-theme="oled"] { --bg:#000000; --panel:#0e0e0e; --panel-2:#181818; --ink:#ffffff; --muted:#9a9a9a; --line:#232323; --accent:#e0a84a; --accent-ink:#000000; --shadow:rgba(0,0,0,0.5); color-scheme:dark; }
  [data-theme="amber"] { --bg:#140d04; --panel:#1e1408; --panel-2:#281b0b; --ink:#e8bf7f; --muted:#a0804f; --line:#30220f; --accent:#f0a33c; --accent-ink:#140d04; --shadow:rgba(0,0,0,0.5); color-scheme:dark; }
  [data-theme="midnight"] { --bg:#0f1724; --panel:#172133; --panel-2:#1e2a40; --ink:#dfe6f0; --muted:#8794aa; --line:#26324a; --accent:#7fb2ff; --accent-ink:#0b1220; --shadow:rgba(0,0,0,0.5); color-scheme:dark; }
  [data-theme="forest"] { --bg:#121a14; --panel:#19241c; --panel-2:#213024; --ink:#dfe8dc; --muted:#8c9e8a; --line:#263428; --accent:#9dc47a; --accent-ink:#101a0f; --shadow:rgba(0,0,0,0.5); color-scheme:dark; }
  [data-theme="slate"] { --bg:#22262b; --panel:#2a2f35; --panel-2:#323840; --ink:#d9dde2; --muted:#8f97a0; --line:#3a4048; --accent:#c9a86a; --accent-ink:#1c1f23; --shadow:rgba(0,0,0,0.5); color-scheme:dark; }
  [data-theme="rose"] { --bg:#1d1418; --panel:#271b21; --panel-2:#30222a; --ink:#f0dfe4; --muted:#a88f97; --line:#3a2a31; --accent:#e79aa8; --accent-ink:#1d1418; --shadow:rgba(0,0,0,0.5); color-scheme:dark; }

  /* Library toolbar: sort + Drive */
  .lib-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .sort-wrap { display: flex; align-items: center; gap: 8px; font-family: var(--sans); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  #app select {
    font: 14px var(--sans); color: var(--ink); background: var(--line); border: none; border-radius: 8px;
    padding: 8px 28px 8px 10px; -webkit-appearance: none; appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .drive-links { display: flex; align-items: center; gap: 8px; }
  .drive-state { font-family: var(--sans); font-size: 12px; color: var(--muted); }
  #app a.btn { text-decoration: none; color: var(--ink); background: var(--line); border-radius: 8px; padding: 7px 11px; font-family: var(--sans); font-size: 13px; }
  #app .drive-links .btn { color: var(--ink); }
  /* A book that is on Drive but not yet on this device. */
  .card.remote .cover { opacity: 0.78; }
  .cloud {
    position: absolute; right: 7px; bottom: 7px; z-index: 1;
    font-family: var(--sans); font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
    background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 3px 8px;
  }
  #app button.btn.danger { background: #b3261e; color: #fff; }
  #app button.btn.danger:hover { background: #c53a31; }
  .remove-note { font-family: var(--sans); font-size: 13px; line-height: 1.5; color: var(--muted); }

  /* Full-screen icon beside the size slider */
  #app button.fs-icon { align-self: flex-end; width: 42px; height: 42px; padding: 0; font-size: 19px; line-height: 1; display: grid; place-items: center; }

  /* Bottom progress footer */
  /* Progress text sits at the top, under the thin progress line, so the
     text can use the whole bottom of the screen. */
  #foot {
    flex: none; pointer-events: none; background: var(--bg);
    padding: 5px 16px 3px;
  }
  #foot .foot-track { display: none; }   /* the line above already shows progress */
  .foot-text {
    display: flex; justify-content: space-between; gap: 12px; margin-bottom: 0;
    font-family: var(--sans); font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .foot-text span { overflow: hidden; text-overflow: ellipsis; }
  .foot-track { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .foot-track i { display: block; height: 100%; width: 0; background: var(--accent); }

  /* ---------------- Library as a list ----------------
     One slim row per book: a small cover, the title in full, and progress
     on the right, so names can be read while flicking down the list. */
  #app .grid, #app .shelf {
    display: flex; flex-direction: column; gap: 0; overflow: visible;
    border-top: 1px solid var(--line);
  }
  #app .grid { margin-top: 14px !important; }
  #app .grid .card, #app .shelf .card {
    display: grid; width: auto; flex: none;
    grid-template-columns: 40px 1fr auto;
    grid-template-areas: "cover title pct" "cover author pct" "cover meter meter";
    column-gap: 14px; row-gap: 2px; align-items: center;
    padding: 11px 2px; border-bottom: 1px solid var(--line); border-radius: 0;
  }
  #app .grid .card:active, #app .shelf .card:active { background: var(--panel); }
  #app .grid .cover, #app .shelf .cover {
    grid-area: cover; width: 40px; aspect-ratio: 2 / 3; align-self: center;
    border-radius: 3px; box-shadow: 0 1px 4px var(--shadow);
  }
  #app .grid .cover.gen, #app .shelf .cover.gen { padding: 0; display: grid; place-items: center; }
  #app .grid .cover.gen::before, #app .shelf .cover.gen::before { width: 3px; }
  #app .grid .cover.gen > div, #app .shelf .cover.gen > div { display: none; }
  #app .grid .cover.gen::after, #app .shelf .cover.gen::after {
    content: attr(data-initial); font-family: var(--serif); font-size: 19px; font-weight: 600;
    color: var(--ink); padding-left: 3px; width: 100%; text-align: center;
  }
  #app .grid .card-title, #app .shelf .card-title { grid-area: title; font-size: 16px; line-height: 1.3; align-self: end; }
  #app .grid .card-author, #app .shelf .card-author {
    grid-area: author; align-self: start;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #app .grid .card-meter, #app .shelf .card-meter { grid-area: meter; margin-top: 5px; }
  #app .grid .card-pct, #app .shelf .card-pct { grid-area: pct; text-align: right; white-space: nowrap; padding-left: 4px; }
  #app .grid .card.remote .card-pct { max-width: 110px; white-space: normal; line-height: 1.3; }
  #app .cloud { right: 2px; bottom: 2px; font-size: 9px; padding: 1px 4px; }
  #app .grid .card-del, #app .shelf .card-del { top: 50%; right: 0; transform: translateY(-50%); }
  #app .grid.editing .card-pct, #app .shelf.editing .card-pct { visibility: hidden; }
  #app .section-label { margin: 22px 2px 8px; }

  /* Library search */
  .search-wrap { position: relative; margin-top: 18px; }
  #app #libSearch {
    width: 100%; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 12px; padding: 12px 44px 12px 16px; font: 16px var(--sans);
    -webkit-appearance: none; appearance: none;
  }
  #app #libSearch::-webkit-search-cancel-button { display: none; }
  #app #searchClear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
  .search-empty { padding: 18px 4px; font-family: var(--sans); font-size: 14px; color: var(--muted); }

  /* Library / Archive tabs */
  .view-tabs { display: flex; gap: 6px; margin-top: 16px; background: var(--panel); border-radius: 12px; padding: 4px; }
  #app button.vtab {
    flex: 1; border: none; background: none; border-radius: 9px; padding: 9px 10px; cursor: pointer;
    font: 600 14px var(--sans); color: var(--muted);
  }
  #app button.vtab[aria-selected="true"] { background: var(--panel-2); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }
  #app .card.archived .cover { filter: grayscale(0.6); }

  #content .speaking { background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 6px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 16%, transparent); }
  #app button.fs-icon.on { background: var(--accent); color: var(--accent-ink); }
  .row .fs-icon + .fs-icon { margin-left: -4px; }

  /* Stats */
  .stats { padding: 14px 16px 10px; font-family: var(--sans); }
  .stat-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat-tile { background: var(--panel-2); border-radius: 12px; padding: 12px; }
  .stat-tile b { display: block; font-size: 24px; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat-tile span { font-size: 12px; color: var(--muted); }
  .stat-h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em; margin: 20px 2px 8px; display: flex; justify-content: space-between; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 0 2px; }
  .bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 5px; height: 100%; min-width: 0; }
  .bar i { display: block; width: 100%; max-width: 34px; background: var(--accent); border-radius: 4px 4px 1px 1px; min-height: 2px; opacity: 0.9; }
  .bar i.zero { background: var(--line); }
  .bar em { font-style: normal; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .bar small { font-size: 10px; color: var(--ink); font-variant-numeric: tabular-nums; min-height: 12px; }
  .stats-note { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.5; }

  /* Bookmarks */
  .bm-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px 6px; font-family: var(--sans); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em; }
  .bm-head .btn { text-transform: none; letter-spacing: 0; }
  .bm-item { display: flex; align-items: center; gap: 8px; padding: 0 10px 0 0; }
  #app .bm-item .toc-item { flex: 1; min-width: 0; }
  .bm-item .snip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #app .bm-del { background: none; border: none; color: var(--muted); font-size: 18px; padding: 8px; cursor: pointer; }
  .bm-empty { padding: 4px 18px 10px; font-family: var(--sans); font-size: 13px; color: var(--muted); }

  .rename-row { display: flex; gap: 8px; }
  #app #renameInput { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 11px 12px; font: 15px var(--sans); }

  /* Download-all progress */
  .dl-strip { background: var(--panel); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-family: var(--sans); }
  .dl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; }
  .dl-top span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dl-track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 9px; }
  .dl-track i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }

  /* A back button that is easy to find and hit */
  #app .row.controls button.back-btn {
    min-width: 54px; padding: 4px 12px 8px; font-size: 34px; line-height: 1; font-weight: 700;
    color: var(--accent); background: var(--panel-2); border: 1.5px solid var(--accent);
  }

  #app .card.loading .card-pct { color: var(--accent); font-variant-numeric: tabular-nums; }
  #app .card.loading .cover { animation: dlpulse 1.4s ease-in-out infinite; }
  @keyframes dlpulse { 50% { opacity: 0.45; } }

  /* Keep clear of the clock and the home bar when installed full screen */
  #app { padding-top: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom, 0px); }

  /* Colour sheet */
  #app { --sel: var(--accent); }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 12px; padding: 14px 16px 6px; }
  #app button.swatch {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 11px; text-align: left; cursor: pointer;
    display: flex; flex-direction: column; gap: 7px; min-height: 86px;
  }
  .swatch .aa { font-family: var(--serif); font-size: 24px; line-height: 1; }
  .swatch .nm { font-family: var(--sans); font-size: 12px; color: var(--muted); }
  .swatch .ac { height: 4px; width: 55%; border-radius: 2px; background: var(--accent); }
  #app button.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--sel); }
  .sheet-sub { font-family: var(--sans); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.09em; padding: 14px 16px 0; }
  .face-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px 16px 6px; }
  #app button.face-btn {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
    padding: 11px 12px; text-align: left; display: flex; flex-direction: column; gap: 3px;
  }
  .face-btn .fa { font-size: 21px; line-height: 1.15; }
  .face-btn .fn { font-family: var(--sans); font-size: 11.5px; color: var(--muted); }
  #app button.face-btn[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--sel); }
  #app .row.controls button.btn { padding: 11px 10px; }

  #app {
    --fs: 20px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --measure: 65ch;

    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font-family: var(--serif);
    overflow: hidden;
    touch-action: manipulation;
  }
  #app *, #app *::before, #app *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #app button, #app input, #app textarea { font: inherit; color: inherit; }
  #app :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* ---------------- Library ---------------- */
  #library { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .lib-inner { width: 100%; max-width: 1000px; margin: 0 auto; padding: 28px 20px 40px; }

  .lib-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
  }
  .lib-head h1 {
    margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.015em;
  }
  .lib-head .count {
    font-family: var(--sans); font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.09em;
  }
  .lib-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .head-actions { display: flex; align-items: center; gap: 10px; }
  #app button.btn.tiny { padding: 7px 11px; font-size: 13px; border-radius: 8px; }

  .grid {
    display: grid; gap: 22px 18px;
    grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  }
  .card {
    display: flex; flex-direction: column; gap: 8px;
    background: none; border: none; padding: 0; text-align: left; cursor: pointer;
    position: relative;
  }
  .cover {
    aspect-ratio: 2 / 3; width: 100%; border-radius: 3px;
    overflow: hidden; background: var(--panel-2);
    box-shadow: 0 2px 10px var(--shadow);
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Generated cover for books with no cover art — the common case. */
  .cover.gen { padding: 16px 14px; }
  .cover.gen::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: var(--accent); opacity: 0.85;
  }
  .cover.gen .gen-title {
    font-size: 15px; line-height: 1.28; font-weight: 600;
    text-wrap: balance; overflow: hidden; color: var(--ink);
  }
  .cover.gen .gen-author {
    font-family: var(--sans); font-size: 10px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--muted);
  }
  .card:hover .cover, .card:focus-visible .cover { box-shadow: 0 4px 16px var(--shadow); }

  .card-title {
    font-size: 14px; line-height: 1.35; font-weight: 600;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-author { font-family: var(--sans); font-size: 11.5px; color: var(--muted); }
  .card-meter { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .card-meter i { display: block; height: 100%; background: var(--accent); }
  .card-pct {
    font-family: var(--sans); font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  /* Shown by the Edit toggle rather than on hover — a phone has no hover,
     which left books impossible to remove on the device this is built for. */
  .card-del {
    position: absolute; top: 6px; right: 6px; width: 30px; height: 30px;
    border-radius: 50%; border: none; cursor: pointer; line-height: 1;
    background: var(--panel); color: var(--ink);
    font-size: 16px; display: none; place-items: center;
    box-shadow: 0 1px 6px var(--shadow);
  }
  .grid.editing .card-del, .shelf.editing .card-del { display: grid; }
  .grid.editing .card, .shelf.editing .card { cursor: default; }

  /* Continue reading */
  .section-label {
    font-family: var(--sans); font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.09em; margin: 26px 2px 10px;
  }
  .shelf {
    display: flex; gap: 16px; overflow-x: auto; padding-bottom: 4px;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  }
  .shelf .card { flex: 0 0 118px; width: 118px; }

  .drop {
    border: 1px dashed var(--line); border-radius: 12px;
    padding: 44px 24px; text-align: center; color: var(--muted);
    font-family: var(--sans); font-size: 14px; line-height: 1.6;
  }
  .drop strong { color: var(--ink); font-weight: 600; }
  #library.dragging .drop { border-color: var(--accent); color: var(--ink); }

  .notice {
    font-family: var(--sans); font-size: 13.5px; line-height: 1.55;
    background: var(--panel); border-left: 3px solid var(--accent);
    padding: 12px 14px; border-radius: 0 8px 8px 0; margin-bottom: 20px;
  }

  /* ---------------- Reader ---------------- */
  #progress { position: relative; flex: none; height: 3px; background: var(--line); }
  #progressFill { height: 100%; width: 0; background: var(--accent); }
  #progressHit { position: absolute; left: 0; right: 0; top: -10px; bottom: -10px; cursor: pointer; }

  #reader {
    flex: 1; overflow-y: auto; position: relative;
    padding: 12px 22px 60vh 22px;
    font-size: var(--fs); line-height: 1.6;
    overscroll-behavior: contain;
    touch-action: pan-y;   /* two fingers resize the text instead of zooming the page */
  }
  #reader { font-family: var(--read-font, var(--serif)); }
  #content { max-width: var(--measure); margin: 0 auto; will-change: transform; }
  /* Lines run the full width of the screen: justified, with long words
     split by a hyphen where needed so the gaps between words stay small. */
  #content p {
    margin: 0 0 1em; text-align: justify;
    -webkit-hyphens: auto; hyphens: auto;
    -webkit-hyphenate-limit-before: 3; -webkit-hyphenate-limit-after: 3;
    hyphenate-limit-chars: 6 3 3;
  }
  #content h1, #content h2, #content h3, #content h4 {
    font-size: 1.12em; font-weight: 600; line-height: 1.35;
    margin: 1.9em 0 0.7em; text-wrap: balance;
  }
  #content .chapter-start { margin-top: 0; }
  #content blockquote { margin: 1em 0; padding-left: 1em; border-left: 2px solid var(--line); color: var(--muted); }
  /* The page only ever moves up and down: nothing in a book (a long link,
     a wide table, an oversized picture) may push it sideways. */
  #reader { overflow-x: hidden; overscroll-behavior-x: none; }
  #content { max-width: 100%; overflow-wrap: break-word; }
  #content * { max-width: 100%; }
  #content :not(pre):not(pre *) { white-space: normal; }
  #content img { max-width: 100%; height: auto; display: block; margin: 1.2em auto; border-radius: 2px; }
  #content hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
  #content ul, #content ol { margin: 0 0 1em; padding-left: 1.4em; }
  #content pre { overflow-x: auto; font-size: 0.85em; }
  #content table { display: block; overflow-x: auto; border-collapse: collapse; }
  #content .plain { white-space: pre-wrap; overflow-wrap: break-word; }
  .chapter + .chapter { border-top: 1px solid var(--line); padding-top: 2em; margin-top: 2.4em; }

  /* ---------------- Control bar ---------------- */
  /* Overlaid rather than in flow: hiding it must not resize the reader,
     because a resize reflows the text and moves the line you are on. */
  #readerView { position: relative; }
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 8px 12px calc(6px + var(--sab)) 12px;
    display: flex; flex-direction: column; gap: 7px;
    transition: transform 0.26s ease, opacity 0.26s ease;
  }
  #app.immersive #bar, #app.nobar #bar {
    transform: translateY(110%); opacity: 0; pointer-events: none;
  }
  .bar-inner { width: 100%; max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 7px; }
  /* Compact bar: no separate status line (the top row shows progress) and
     no "Speed" label; the wpm sits at the end of the slider row. */
  #status.quiet { display: none; }
  .speed-val { flex: none; min-width: 34px; text-align: right; font: 600 13px var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
  #app #bar button.fs-icon { width: 36px; height: 36px; font-size: 16px; align-self: center; }
  #app #bar .row.controls button.btn { padding: 8px 10px; }
  #app #bar .row.controls button.back-btn { font-size: 28px; padding: 2px 12px 6px; min-width: 50px; }
  #status {
    font-family: var(--sans); font-size: 12px; color: var(--muted);
    text-align: center; min-height: 15px; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

  .row { display: flex; align-items: center; gap: 12px; }
  .row.controls { gap: 8px; }

  #app button.btn {
    background: var(--line); border: none; border-radius: 10px;
    padding: 11px 13px; font-family: var(--sans); font-size: 15px;
    cursor: pointer; flex: none;
  }
  #app button.btn:hover { background: var(--panel-2); }
  #app button.btn:active { transform: translateY(1px); }
  #app button.primary {
    background: var(--accent); color: var(--accent-ink); font-weight: 700;
    flex: 1; font-size: 17px; padding: 13px;
  }
  #app button.primary:hover { filter: brightness(1.06); background: var(--accent); }

  .slider-block { flex: 1; min-width: 0; }
  .speed-row { display: flex; align-items: center; gap: 10px; }
  .speed-row input { flex: 1; min-width: 0; }
  #app button.btn.step { flex: none; width: 34px; height: 30px; padding: 0; font: 600 18px/1 var(--sans); display: grid; place-items: center; }
  .slider-label {
    display: flex; justify-content: space-between; gap: 8px;
    font-family: var(--sans); font-size: 11px; color: var(--muted);

  #app input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none; margin: 0;

  #app input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  #app input[type=range]::-moz-range-thumb {
    width: 22px; height: 22px; border: none; border-radius: 50%; background: var(--accent); cursor: pointer;
  }

  .sheet {

  }
  .sheet-scroll { overflow-y: auto; padding: 6px 0 calc(10px + var(--sab)); }
  .toc-item {
    display: flex; width: 100%; gap: 12px; align-items: baseline;

  #app .lib-head h1 { font-size: 26px; }

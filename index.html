  });
  $('bmAdd').addEventListener('click', addBookmark);
  $('archiveBtn').addEventListener('click', () => {
    const t = removing; removing = null; closeSheet(removeSheet);
    if (!t) return;
    const did = t.drive ? t.drive.id : (t.book && t.book.driveId);
    if (did) setArchived(did, !archivedIds().has(did), t.title);
  });
  // Finished a book: offer to file it away.
  let finished = null;
  $('doneKeep').addEventListener('click', () => { finished = null; closeSheet(doneSheet); });
  $('doneArchive').addEventListener('click', () => {
    const f = finished; finished = null; closeSheet(doneSheet);
    if (f) { toLibrary(); setArchived(f.driveId, true, f.title); }
  });
  $('tabLibrary').addEventListener('click', () => { view = 'library'; markTabs(); renderLibrary(); });
  $('tabArchive').addEventListener('click', () => { view = 'archive'; markTabs(); renderLibrary(); });
  function markTabs() {
    $('tabLibrary').setAttribute('aria-selected', view === 'library' ? 'true' : 'false');
    $('tabArchive').setAttribute('aria-selected', view === 'archive' ? 'true' : 'false');
  }
  $('removeDrive').addEventListener('click', () => doRemove(true));
  $('fsBtn2').addEventListener('click', () => { toggleFullscreen(); showChrome(); });
  $('ttsBtn').addEventListener('click', () => { speaking ? stopSpeak() : startSpeak(); showChrome(); });
  themeSheet.addEventListener('click', (e) => { if (e.target === themeSheet) closeSheet(themeSheet); });

  speed.addEventListener('input', () => { settings.wpm = +speed.value; saveSettings(); render(); showChrome(); });
  function nudgeSpeed(d) {
    speed.value = Math.min(WPM_MAX, Math.max(WPM_MIN, +speed.value + d));
    settings.wpm = +speed.value; saveSettings(); render(); showChrome();
  }
  $('slowerBtn').addEventListener('click', () => nudgeSpeed(-2));
  $('fasterBtn').addEventListener('click', () => nudgeSpeed(2));
  font.addEventListener('input', () => {
    const keep = lastAnchor;              // read before the reflow invalidates it
    settings.font = +font.value;
    app.style.setProperty('--fs', font.value + 'px');
    saveSettings();
    invalidate();
    requestAnimationFrame(() => reflowTo(keep));
    showChrome();
  });

  // Tap to pause, but not when the tap was a drag or a text selection.
  // Taps are counted within a short window, then acted on together:
  // one tap plays or pauses, two hide the bottom bar and go full screen
  // (where the browser allows it), three bring the bar back and leave
  // full screen. A single tap waits a beat so it isn't
  // mistaken for the start of a double or triple.
  const DBL_MS = 300;
  let downX = 0, downY = 0, downTop = 0, lastTap = 0, lastTapX = 0, lastTapY = 0, tapTimer = null, taps = 0;
  reader.addEventListener('pointerdown', (e) => {
    downX = e.clientX; downY = e.clientY; downTop = reader.scrollTop;
  });
  reader.addEventListener('pointerup', (e) => {
    const moved = Math.hypot(e.clientX - downX, e.clientY - downY) > 8
      || Math.abs(reader.scrollTop - downTop) > 2;
    const selecting = !(window.getSelection() || { isCollapsed: true }).isCollapsed;
    if (moved || selecting || !book || pinch || performance.now() - pinchEnd < 400) return;
    const now = performance.now();
    const near = Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 60;
    taps = (tapTimer && now - lastTap < DBL_MS && near) ? taps + 1 : 1;
    lastTap = now; lastTapX = e.clientX; lastTapY = e.clientY;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => {
      const n = taps; tapTimer = null; taps = 0;
      if (n === 1) { toggle(); showChrome(); }
      else if (n === 2) { app.classList.add('nobar'); setFullscreen(true); }
      else { app.classList.remove('nobar'); setFullscreen(false); showChrome(); }
    }, DBL_MS);
  });

  // Belt and braces: if anything still nudges the page sideways, put it back.
  reader.addEventListener('scroll', () => { if (reader.scrollLeft) reader.scrollLeft = 0; }, { passive: true });

  /* ---- pinch to resize the text ----
     Two fingers spread or pinch change the font size (same as the
     slider), in whole-pixel steps so the text only reflows when the
     size actually changes. Any taps from those fingers are ignored. */
  let pinch = null, pinchEnd = 0;
  const fingers = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  reader.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2 && book) {
      pinch = { d: fingers(e.touches) || 1, fs: +font.value };
      clearTimeout(tapTimer); tapTimer = null; taps = 0;
    }
  }, { passive: true });
  reader.addEventListener('touchmove', (e) => {
    if (!pinch || e.touches.length < 2) return;
    e.preventDefault();
    const want = Math.round(Math.max(+font.min, Math.min(+font.max, pinch.fs * fingers(e.touches) / pinch.d)));
    if (want !== +font.value) { font.value = want; font.dispatchEvent(new Event('input')); }
  }, { passive: false });
  const endPinch = (e) => { if (pinch && e.touches.length < 2) { pinch = null; pinchEnd = performance.now(); } };
  reader.addEventListener('touchend', endPinch, { passive: true });
  reader.addEventListener('touchcancel', endPinch, { passive: true });
  // iPhone Safari's own page-zoom gesture
  ['gesturestart', 'gesturechange'].forEach((ev) => reader.addEventListener(ev, (e) => e.preventDefault()));

  function seekFromEvent(e) {
    const r = hit.getBoundingClientRect();
    seekTo(((e.clientX - r.left) / r.width) * endScroll());
  }
  hit.addEventListener('pointerdown', (e) => { hit.setPointerCapture(e.pointerId); seekFromEvent(e); });
  hit.addEventListener('pointermove', (e) => { if (hit.hasPointerCapture(e.pointerId)) seekFromEvent(e); });

  // While the text is moving, a touch or wheel takes the page over; the
  // loop waits (see step) rather than wrestling the finger for scrollTop.
  const grab = () => { wakeUp(); if (scrolling) { held = true; coast = true; lastUserScroll = performance.now(); } };
  const letGo = (e) => { held = !!(e.touches && e.touches.length); lastUserScroll = performance.now(); };
  reader.addEventListener('touchstart', grab, { passive: true });
  reader.addEventListener('touchend', letGo, { passive: true });
  reader.addEventListener('touchcancel', letGo, { passive: true });
  reader.addEventListener('wheel', () => {
    if (scrolling) { coast = true; lastUserScroll = performance.now(); }
  }, { passive: true });

  reader.addEventListener('scroll', () => {
    if (coast) lastUserScroll = performance.now();
    if (!scrolling) { noteAnchor(); render(); saveProgressSoon(); }
  }, { passive: true });

  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''))) {
      if (e.key === 'Escape') closeSheet(pasteSheet);
      return;
    }
    if (sheetOpen()) {
      if (e.key === 'Escape') { closeSheet(tocSheet); closeSheet(pasteSheet); closeSheet(themeSheet); closeSheet(removeSheet); closeSheet(doneSheet); closeSheet(statsSheet); e.preventDefault(); }
      return;
    }
    if (readerView.classList.contains('hidden')) return;
    switch (e.key) {
      case ' ': case 'k': e.preventDefault(); toggle(); break;
      case 'ArrowUp': e.preventDefault(); nudge(-NUDGE); break;
      case 'ArrowDown': e.preventDefault(); nudge(NUDGE); break;
      case 'ArrowLeft': e.preventDefault(); nudgeSpeed(-2); break;
      case 'ArrowRight': e.preventDefault(); nudgeSpeed(2); break;
      case 'Home': e.preventDefault(); seekTo(0); break;
      case 'End': e.preventDefault(); seekTo(endScroll()); break;
      case 'Escape': e.preventDefault(); toLibrary(); break;
      case 't': e.preventDefault(); openSheet(tocSheet); break;
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (scrolling) { lastT = 0; acquireWake(); }   // the OS drops the lock when hidden
      if (!book && gas) refreshDrive();               // pick up what other devices read meanwhile
    } else { saveProgress(); flushSync(); }
  });
  window.addEventListener('pagehide', () => { saveProgress(); flushSync(); });

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (!book) return;
    // lastAnchor was recorded before the reflow; measuring now would read
    // the new layout and keep whatever paragraph slid under the old offset.
    const keep = lastAnchor;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => reflowTo(keep), 150);
  });

  /* iPhone Home Screen app. Two iOS quirks cost screen space:
     - iOS can end the app's window above the home bar and keep the strip
       below for itself. Padding for the home bar is then wasted space, so
       drop it while the window is short.
     - After the keyboard has been open, the window can stay shrunk. Hiding
       and re-showing the app makes iOS measure it again. */
  if (navigator.standalone) {
    let tallest = window.innerHeight;
    const fitHomeBar = () => {
      tallest = Math.max(tallest, window.innerHeight);
      const portrait = window.innerHeight >= window.innerWidth;
      const gap = Math.max(screen.width, screen.height) - app.offsetHeight;
      app.style.setProperty('--sab', portrait && gap > 30 ? '0px' : '');
    };
    const remeasure = () => {
      if (tallest - window.innerHeight > 4) {
        const top = reader.scrollTop;
        app.style.display = 'none'; void document.body.offsetHeight; app.style.display = '';
        reader.scrollTop = top;
      }
      fitHomeBar();
    };
    fitHomeBar();
    window.addEventListener('resize', fitHomeBar);
    // iOS can shrink the window after launch without saying so: check again
    // shortly after opening, and whenever the app's own height changes.
    [300, 1000, 3000].forEach((ms) => setTimeout(fitHomeBar, ms));
    window.addEventListener('pageshow', fitHomeBar);
    if (window.ResizeObserver) new ResizeObserver(fitHomeBar).observe(app);
    document.addEventListener('focusout', () => setTimeout(remeasure, 160));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(remeasure, 160); });
  }

  if (!IN_GAS && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  if (!IN_GAS && !api) {
    // A Home Screen app on iPhone keeps its own storage, separate from the
    // browser, so it can't see a link opened in Safari or Chrome. Pasting
    // the setup link here connects it.
    const cb = $('connectBtn');
    cb.classList.remove('hidden');
    cb.addEventListener('click', () => {
      const link = prompt('Paste your setup link (the one with #key=…):', '');
      if (!link) return;
      try {
        const h = new URLSearchParams(link.slice(link.indexOf('#') + 1));
        if (!h.get('key') || !h.get('api')) throw new Error('missing');
        localStorage.setItem(API_STORE, JSON.stringify({ key: h.get('key'), url: h.get('api') }));
        location.reload();
      } catch (_) { alert('That doesn\'t look like the setup link. Copy the whole link, including the part after #.'); }
    });
    setTimeout(() => showNotice('Not connected to Google Drive on this device yet. Tap Connect Drive and paste your setup link.'), 400);
  }
  window.addEventListener('online', () => { if (!book && gas) refreshDrive(); });

  /* ---- start ---- */
  applyFace();
  speed.value = settings.wpm;
  font.value = settings.font;
  app.style.setProperty('--fs', settings.font + 'px');
  applyTheme();
  if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
    fsBtn.classList.remove('hidden');
  }
  const sortSel = $('sortSel');
  if (!SORTS[settings.sort]) settings.sort = 'recent';
  sortSel.value = settings.sort;
  sortSel.addEventListener('change', () => { settings.sort = sortSel.value; saveSettings(); renderLibrary(); });
  setEditing(false);
  renderLibrary();
  render();
  if (gas) {
    $('driveRefresh').addEventListener('click', () => refreshDrive(true));
    refreshDrive();
  }
})();
</script>
</body>
</html>

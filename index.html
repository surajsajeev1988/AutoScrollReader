<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const app = $('app');
  const reader = $('reader'), content = $('content');
  const libraryView = $('library'), readerView = $('readerView');
  const playBtn = $('playBtn'), speed = $('speed'), font = $('font');
  const speedVal = $('speedVal'), fontVal = $('fontVal'), statusEl = $('status');
  const fill = $('progressFill'), hit = $('progressHit');
  const footFill = $('footFill'), footLeft = $('footLeft'), footRight = $('footRight');
  const grid = $('grid'), drop = $('drop'), libCount = $('libCount'), libNotice = $('libNotice');
  const shelf = $('shelf'), continueWrap = $('continueWrap');
  const editBtn = $('editBtn'), fsBtn = $('fsBtn');
  const fileInput = $('fileInput'), busy = $('busy');
  const tocSheet = $('tocSheet'), tocList = $('tocList');
  const pasteSheet = $('pasteSheet'), themeSheet = $('themeSheet'), removeSheet = $('removeSheet'), doneSheet = $('doneSheet'), statsSheet = $('statsSheet');

  /* =====================================================================
     ZIP reader. An EPUB is a ZIP, and the artifact sandbox blocks external
     scripts, so the central directory is walked by hand and DEFLATE is
     handed to the platform's DecompressionStream.
     ===================================================================== */
  const utf8 = new TextDecoder('utf-8');

  async function unzip(buffer) {
    const u8 = new Uint8Array(buffer);
    const dv = new DataView(buffer);

    // The end-of-central-directory record sits in the last 64KB, after an
    // optional trailing comment, so scan backwards for its signature.
    let eocd = -1;
    const floor = Math.max(0, u8.length - 22 - 0xffff);
    for (let i = u8.length - 22; i >= floor; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Err('That file is not a ZIP archive, so it cannot be an EPUB.');

    const count = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);
    const entries = new Map();
    for (let i = 0; i < count && off + 46 <= u8.length; i++) {
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const compSize = dv.getUint32(off + 20, true);
      const nameLen = dv.getUint16(off + 28, true);
      const extraLen = dv.getUint16(off + 30, true);
      const commentLen = dv.getUint16(off + 32, true);
      const localOff = dv.getUint32(off + 42, true);
      const name = utf8.decode(u8.subarray(off + 46, off + 46 + nameLen));
      entries.set(name, { method, compSize, localOff });
      off += 46 + nameLen + extraLen + commentLen;
    }

    async function bytes(name) {
      const e = entries.get(name);
      if (!e) return null;
      // Sizes come from the central directory; the local header's copies are
      // zero when the entry was written with a trailing data descriptor.
      const nameLen = dv.getUint16(e.localOff + 26, true);
      const extraLen = dv.getUint16(e.localOff + 28, true);
      const start = e.localOff + 30 + nameLen + extraLen;
      const raw = u8.subarray(start, start + e.compSize);
      if (e.method === 0) return raw;
      if (e.method !== 8) throw new Err('This EPUB uses a compression method this reader cannot read.');
      const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    const text = async (name) => { const b = await bytes(name); return b ? utf8.decode(b) : null; };
    return { entries, bytes, text, has: (n) => entries.has(n) };
  }

  /* Errors carrying a message that is safe to show the reader. */
  function Err(msg) { const e = new Error(msg); e.friendly = true; return e; }

  /* =====================================================================
     EPUB parsing
     ===================================================================== */
  const xml = (str) => new DOMParser().parseFromString(str, 'application/xml');
  const tags = (node, local) => Array.from(node.getElementsByTagNameNS('*', local));
  const tag1 = (node, local) => tags(node, local)[0] || null;

  function resolvePath(base, rel) {
    rel = decodeURIComponent(String(rel || '').split('#')[0].trim());
    if (!rel) return '';
    const stack = base.split('/').slice(0, -1);
    for (const part of rel.split('/')) {
      if (!part || part === '.') continue;
      if (part === '..') stack.pop(); else stack.push(part);
    }
    return stack.join('/');
  }

  const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp' };
  function b64(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return btoa(s);
  }
  function dataUri(u8, path) {
    const ext = (path.split('.').pop() || '').toLowerCase();
    return 'data:' + (MIME[ext] || 'image/jpeg') + ';base64,' + b64(u8);
  }

  const IMG_MAX = 1.2e6;    // per image
  const IMG_BUDGET = 9e6;   // per book, so the library stays a sane size

  async function parseEpub(buffer, fallbackTitle) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Err('This browser cannot decompress EPUB files. Try a current version of Safari, Chrome, or Firefox.');
    }
    const zip = await unzip(buffer);
    if (zip.has('META-INF/encryption.xml')) {
      throw new Err('This book is DRM-protected, so its text cannot be opened.');
    }

    const containerXml = await zip.text('META-INF/container.xml');
    if (!containerXml) throw new Err('This EPUB is missing its container.xml, so there is no way to find the book inside it.');
    const rootfile = tag1(xml(containerXml), 'rootfile');
    const opfPath = rootfile && rootfile.getAttribute('full-path');
    if (!opfPath) throw new Err('This EPUB does not say where its contents are. The file may be damaged.');

    const opfText = await zip.text(opfPath);
    if (!opfText) throw new Err('This EPUB points at a contents file that is not in the archive.');
    const opf = xml(opfText);

    const meta = tag1(opf, 'metadata') || opf;
    const title = (tag1(meta, 'title') || {}).textContent || fallbackTitle || 'Untitled';
    const author = (tag1(meta, 'creator') || {}).textContent || '';

    // manifest: id -> { path, type, props }
    const items = new Map(), byPath = new Map();
    for (const it of tags(opf, 'item')) {
      const id = it.getAttribute('id');
      const href = it.getAttribute('href');
      if (!id || !href) continue;
      const rec = {
        id, path: resolvePath(opfPath, href),
        type: it.getAttribute('media-type') || '',
        props: it.getAttribute('properties') || ''
      };
      items.set(id, rec);
      byPath.set(rec.path, rec);
    }

    // Reading order. linear="no" marks material outside the main flow.
    const spineEl = tag1(opf, 'spine');
    const spine = [];
    for (const ref of tags(spineEl || opf, 'itemref')) {
      if (ref.getAttribute('linear') === 'no') continue;
      const it = items.get(ref.getAttribute('idref'));
      if (it && /html|xml/.test(it.type)) spine.push(it);
    }
    if (!spine.length) throw new Err('This EPUB lists no readable chapters.');

    // Chapter titles, from the EPUB 3 nav document or the EPUB 2 NCX.
    const titles = new Map();
    const navItem = Array.from(items.values()).find((i) => /\bnav\b/.test(i.props));
    if (navItem) {
      const navText = await zip.text(navItem.path);
      if (navText) {
        const nav = xml(navText);
        const toc = tags(nav, 'nav').find((n) => (n.getAttribute('epub:type') || n.getAttributeNS('http://www.idpf.org/2007/ops', 'type') || '').includes('toc'))
          || tag1(nav, 'nav') || nav;
        for (const a of tags(toc, 'a')) {
          const p = resolvePath(navItem.path, a.getAttribute('href'));
          const label = a.textContent.trim();
          if (p && label && !titles.has(p)) titles.set(p, label);
        }
      }
    }
    if (!titles.size) {
      const ncx = Array.from(items.values()).find((i) => /ncx/.test(i.type) || /\.ncx$/.test(i.path));
      const ncxText = ncx && await zip.text(ncx.path);
      if (ncxText) {
        for (const np of tags(xml(ncxText), 'navPoint')) {
          const contentEl = tag1(np, 'content');
          const labelEl = tag1(np, 'text');
          if (!contentEl || !labelEl) continue;
          const p = resolvePath(ncx.path, contentEl.getAttribute('src'));
          const label = labelEl.textContent.trim();
          if (p && label && !titles.has(p)) titles.set(p, label);
        }
      }
    }

    // Cover art.
    let cover = null;
    let coverItem = Array.from(items.values()).find((i) => /cover-image/.test(i.props));
    if (!coverItem) {
      const m = tags(meta, 'meta').find((x) => x.getAttribute('name') === 'cover');
      if (m) coverItem = items.get(m.getAttribute('content'));
    }
    if (coverItem && /image/.test(coverItem.type)) {
      const b = await zip.bytes(coverItem.path);
      if (b && b.length < 3e6) cover = dataUri(b, coverItem.path);
    }

    // Chapters.
    let imgBudget = IMG_BUDGET;
    const imgCache = new Map();
    const chapters = [];
    let words = 0;

    for (let i = 0; i < spine.length; i++) {
      const item = spine[i];
      const raw = await zip.text(item.path);
      if (!raw) continue;
      const doc = new DOMParser().parseFromString(raw, 'application/xhtml+xml');
      const body = doc.querySelector('body')
        || new DOMParser().parseFromString(raw, 'text/html').querySelector('body');
      if (!body) continue;

      const out = document.createElement('div');
      await sanitizeInto(body, out, {
        base: item.path,
        image: async (src) => {
          const p = resolvePath(item.path, src);
          if (imgCache.has(p)) return imgCache.get(p);
          const rec = byPath.get(p);
          if (!rec || !/image/.test(rec.type)) return null;
          const b = await zip.bytes(p);
          if (!b || b.length > IMG_MAX || b.length > imgBudget) return null;
          imgBudget -= b.length;
          const uri = dataUri(b, p);
          imgCache.set(p, uri);
          return uri;
        }
      });

      const text = out.textContent.replace(/\s+/g, ' ').trim();
      if (!text && !out.querySelector('img')) continue;
      words += text ? text.split(' ').length : 0;

      let name = titles.get(item.path);
      if (!name) {
        const h = out.querySelector('h1, h2, h3, h4');
        name = h && h.textContent.trim();
      }
      chapters.push({ title: name || ('Chapter ' + (chapters.length + 1)), html: out.innerHTML });
    }

    if (!chapters.length) throw new Err('This EPUB has no readable text in it.');
    return { title: title.trim(), author: author.trim(), cover, chapters, words };
  }

  /* ---------------------------------------------------------------
     Sanitizer. Book markup is untrusted and also carries its own
     styling, which would fight the reader's. Keep a structural subset,
     drop every attribute, and re-point images at inlined data.
     --------------------------------------------------------------- */
  const KEEP = new Set(['P', 'DIV', 'SPAN', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'EM', 'I', 'STRONG', 'B',
    'BLOCKQUOTE', 'UL', 'OL', 'LI', 'BR', 'HR', 'IMG', 'FIGURE', 'FIGCAPTION', 'SUP', 'SUB', 'SMALL',
    'CODE', 'PRE', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH', 'CITE', 'Q', 'DL', 'DT', 'DD', 'SECTION',
    'ARTICLE', 'HEADER', 'FOOTER', 'ASIDE', 'MAIN', 'NAV', 'U', 'S', 'MARK', 'RUBY', 'RT', 'RP']);
  const DROP = new Set(['SCRIPT', 'STYLE', 'LINK', 'META', 'IFRAME', 'OBJECT', 'EMBED', 'AUDIO', 'VIDEO', 'SVG', 'CANVAS', 'FORM', 'INPUT', 'BUTTON', 'SELECT', 'TEXTAREA', 'TITLE', 'HEAD']);
  const UNWRAP = new Set(['A', 'BODY', 'HTML', 'FONT', 'CENTER', 'BIG', 'TT', 'ABBR', 'TIME', 'BDI', 'BDO', 'INS', 'DEL', 'LABEL', 'PICTURE', 'TEMPLATE', 'DETAILS', 'SUMMARY']);

  async function sanitizeInto(src, dest, ctx) {
    for (const node of Array.from(src.childNodes)) {
      if (node.nodeType === 3) { dest.appendChild(document.createTextNode(node.nodeValue)); continue; }
      if (node.nodeType !== 1) continue;
      const name = node.tagName.toUpperCase();
      if (DROP.has(name)) continue;

      if (name === 'IMG') {
        const uri = await ctx.image(node.getAttribute('src') || '');
        if (!uri) continue;
        const img = document.createElement('img');
        img.src = uri;
        img.alt = node.getAttribute('alt') || '';
        img.loading = 'lazy';
        dest.appendChild(img);
        continue;
      }
      if (UNWRAP.has(name) || !KEEP.has(name)) {
        await sanitizeInto(node, dest, ctx); // keep the words, drop the wrapper
        continue;
      }
      const el = document.createElement(name.toLowerCase()); // no attributes carried over
      await sanitizeInto(node, el, ctx);
      dest.appendChild(el);
    }
  }

  /* =====================================================================
     Storage. Metadata lives in one store so the library list stays cheap
     to read; chapter text lives in another and is only loaded on open.
     ===================================================================== */
  const DB_NAME = 'autoscroll-reader', BOOKS = 'books', TEXT = 'text';
  let dbPromise = null;
  function db() {
    if (!dbPromise) {
      dbPromise = new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains(BOOKS)) d.createObjectStore(BOOKS, { keyPath: 'id' });
          if (!d.objectStoreNames.contains(TEXT)) d.createObjectStore(TEXT, { keyPath: 'id' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    return dbPromise;
  }
  async function tx(store, mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  /* Some browsers refuse storage outright — Firefox on a file:// page, and
     private windows generally. Reading a book should not depend on being
     able to remember it, so fall back to memory and say so once. */
  const MEM = { books: new Map(), text: new Map() };
  let memoryOnly = false;
  function noStorage() {
    if (memoryOnly) return;
    memoryOnly = true;
    showNotice('This browser will not let the page save books here, so your library empties when you close the tab. Reading works as normal.');
  }
  async function idbOr(fallback, run) {
    if (!memoryOnly) {
      try { return await run(); } catch (_) { noStorage(); }
    }
    return fallback();
  }

  const putBook = (b) => idbOr(() => MEM.books.set(b.id, b),
    () => tx(BOOKS, 'readwrite', (s) => s.put(b)));
  const putText = (t) => idbOr(() => MEM.text.set(t.id, t),
    () => tx(TEXT, 'readwrite', (s) => s.put(t)));
  const getBook = (id) => idbOr(() => MEM.books.get(id),
    () => tx(BOOKS, 'readonly', (s) => s.get(id)));
  const getText = (id) => idbOr(() => MEM.text.get(id),
    () => tx(TEXT, 'readonly', (s) => s.get(id)));
  const allBooks = () => idbOr(() => Array.from(MEM.books.values()),
    () => tx(BOOKS, 'readonly', (s) => s.getAll()));
  const delBook = (id) => idbOr(
    () => { MEM.books.delete(id); MEM.text.delete(id); },
    () => Promise.all([
      tx(BOOKS, 'readwrite', (s) => s.delete(id)),
      tx(TEXT, 'readwrite', (s) => s.delete(id))
    ]));

  function bookId(title, author, size) {
    const s = title + '\u0000' + author + '\u0000' + size;
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(36) + '-' + size.toString(36);
  }

  /* Settings that are not per-book. */
  const SETTINGS = 'autoscroll-reader/settings';
  const settings = Object.assign(
    { speed: 45, font: 20, theme: 'oled', face: 'iowan', sort: 'recent' },
    (() => { try { return JSON.parse(localStorage.getItem(SETTINGS) || '{}'); } catch (_) { return {}; } })()
  );
  // Speed is now set in words per minute, 180-230. Older copies stored a
  // 1-100 slider position; turn that into the same pace.
  const WPM_MIN = 180, WPM_MAX = 230;
  if (!(settings.wpm >= WPM_MIN && settings.wpm <= WPM_MAX)) {
    const old = 60 * Math.pow(15, ((+settings.speed || 45) - 1) / 99);
    settings.wpm = Math.round(Math.min(WPM_MAX, Math.max(WPM_MIN, old)));
  }
  /* Reading positions get their own tiny record. Saving them used to
     rewrite the whole book entry, cover image included, every second or so. */
  const PROGRESS = 'autoscroll-reader/progress';
  const progMap = (() => { try { return JSON.parse(localStorage.getItem(PROGRESS) || '{}') || {}; } catch (_) { return {}; } })();
  function writeProg(id, p) {
    if (p) progMap[id] = p; else delete progMap[id];
    try { localStorage.setItem(PROGRESS, JSON.stringify(progMap)); return true; } catch (_) { return false; }
  }
  function saveSettings() {
    try { localStorage.setItem(SETTINGS, JSON.stringify(settings)); } catch (_) {}
  }

  /* =====================================================================
     Theme
     ===================================================================== */
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  function pageTheme() {
    const stamped = document.documentElement.getAttribute('data-theme');
    if (stamped === 'dark' || stamped === 'light') return stamped === 'dark' ? 'night' : 'paper';
    return darkQuery.matches ? 'night' : 'paper';
  }
  function applyTheme() {
    const t = settings.theme === 'auto' ? pageTheme() : settings.theme;
    app.setAttribute('data-theme', t);
    app.setAttribute('data-face', settings.face);
    const bg = getComputedStyle(app).getPropertyValue('--bg').trim();
    if (themeMeta && bg) themeMeta.content = bg;
    document.documentElement.style.background = bg || '';
    if (typeof markSwatches === 'function') markSwatches();
  }
  darkQuery.addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  /* Reading fonts. The free web fonts come from Google Fonts and are only
     fetched when picked (previews fetch just the few letters they show);
     until one arrives, or offline, the text falls back to the next font in
     its stack. "Apple New York" and "Iowan" are built into iPhones. */
  const FACES = {
    iowan:     { label: 'Iowan Old Style', note: 'Apple Books default', stack: '"Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif' },
    newyork:   { label: 'New York', note: 'Apple system serif', stack: 'ui-serif, "New York", Georgia, serif' },
    source:    { label: 'Source Serif', note: 'Closest to Claude', stack: '"Source Serif 4", Georgia, serif', g: 'Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400' },
    literata:  { label: 'Literata', note: 'Made for e-books', stack: 'Literata, Georgia, serif', g: 'Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400' },
    charis:    { label: 'Charis', note: 'Charter-style, sturdy', stack: '"Charis SIL", Charter, Georgia, serif', g: 'Charis+SIL:ital,wght@0,400;0,700;1,400' },
    lora:      { label: 'Lora', note: 'Soft, warm serif', stack: 'Lora, Georgia, serif', g: 'Lora:ital,wght@0,400;0,600;1,400' },
    garamond:  { label: 'EB Garamond', note: 'Classic book face', stack: '"EB Garamond", Garamond, Georgia, serif', g: 'EB+Garamond:ital,wght@0,400;0,600;1,400' },
    atkinson:  { label: 'Atkinson Hyperlegible', note: 'Easiest on tired eyes', stack: '"Atkinson Hyperlegible", var(--sans)', g: 'Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400' },
    inter:     { label: 'Inter', note: 'Clean sans-serif', stack: 'Inter, var(--sans)', g: 'Inter:ital,opsz,wght@0,14..32,400;0,14..32,600;1,14..32,400' },
    system:    { label: 'System sans', note: "Your phone's own", stack: 'var(--sans)' }
  };
  const faceGrid = $('faceGrid');
  const loadedFaces = new Set();
  function addSheet(href) {
    try {
      const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href;
      document.head.appendChild(l);
      return l;
    } catch (_) { return null; }
  }
  // Previews: one request for every font, limited to the letters on the buttons.
  (function previewFaces() {
    const fams = Object.values(FACES).filter((f) => f.g).map((f) => 'family=' + f.g.split(':')[0]);
    const letters = encodeURIComponent('Aa SourceLiterataCharisLoraEBGaramondAtkinsonInter');
    addSheet('https://fonts.googleapis.com/css2?' + fams.join('&') + '&text=' + letters + '&display=swap');
  })();
  function applyFace() {
    const f = FACES[settings.face] || FACES.iowan;
    if (f.g && !loadedFaces.has(f.g)) {
      loadedFaces.add(f.g);
      const l = addSheet('https://fonts.googleapis.com/css2?family=' + f.g + '&display=swap');
      // When the real font arrives the lines rewrap, so hold the reader's place.
      const settle = () => { if (book && !scrolling) { const keep = lastAnchor; invalidate(); reflowTo(keep); } };
      if (l) l.addEventListener('load', () => {
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(settle); else settle();
      });
    }
    const keep = lastAnchor;
    app.style.setProperty('--read-font', f.stack);
    if (book) { invalidate(); requestAnimationFrame(() => reflowTo(keep)); }
  }

  const THEMES = [
    ['auto', 'Device'], ['night', 'Brass'], ['saffron', 'Saffron'], ['amber', 'Amber'],
    ['oled', 'Black'], ['midnight', 'Midnight'], ['forest', 'Forest'], ['slate', 'Slate'],
    ['rose', 'Rose'], ['paper', 'Paper'], ['parchment', 'Parchment'], ['sepia', 'Sepia'], ['sky', 'Sky']
  ];
  const swatchBox = $('swatches');
  for (const [id, name] of THEMES) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'swatch'; b.dataset.pick = id;
    const aa = document.createElement('span'); aa.className = 'aa'; aa.textContent = 'Aa';
    const ac = document.createElement('span'); ac.className = 'ac';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = name;
    b.append(aa, ac, nm);
    b.addEventListener('click', () => { settings.theme = id; saveSettings(); applyTheme(); });
    swatchBox.appendChild(b);
  }
  function markSwatches() {
    for (const b of swatchBox.children) {
      const id = b.dataset.pick;
      b.setAttribute('data-theme', id === 'auto' ? pageTheme() : id);
      b.setAttribute('aria-pressed', settings.theme === id ? 'true' : 'false');
    }
    for (const b of faceGrid.children) b.setAttribute('aria-pressed', b.dataset.face === settings.face ? 'true' : 'false');
  }
  for (const [id, f] of Object.entries(FACES)) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'face-btn'; b.dataset.face = id;
    const aa = document.createElement('span'); aa.className = 'fa'; aa.textContent = 'Aa ' + f.label.split(' ')[0];
    aa.style.fontFamily = f.stack;
    const nm = document.createElement('span'); nm.className = 'fn'; nm.textContent = f.note;
    b.append(aa, nm);
    b.addEventListener('click', () => { settings.face = id; saveSettings(); applyFace(); markSwatches(); });
    faceGrid.appendChild(b);
  }
  if (!THEMES.some(([id]) => id === settings.theme)) settings.theme = 'oled';
  // Pitch black became the default (Nov 2026): move devices still on the old defaults.
  if (!settings.themeV) { if (settings.theme === 'auto' || settings.theme === 'night') settings.theme = 'oled'; settings.themeV = 2; saveSettings(); }
  // Older saved choices: "serif" was Iowan, "sans" the system sans.
  if (settings.face === 'serif') settings.face = 'iowan';
  if (settings.face === 'sans') settings.face = 'system';
  if (!FACES[settings.face]) settings.face = 'iowan';

  /* =====================================================================
     Reading engine
     ===================================================================== */
  const MIN_PPS = 3, MAX_PPS = 200, MAX_DT = 0.1, NUDGE = 3;

  let book = null;        // { id, title, author, chapters:[{title}] }
  let blocks = [];        // block elements, for position anchoring
  let sections = [];      // chapter wrappers
  let scrolling = false, rafId = null, lastT = 0, pos = 0, applied = 0;
  let wakeLock = null, lastStatusT = 0, flashUntil = 0, flashMsg = '';
  let held = false, coast = false, lastUserScroll = 0, wantWake = false;
  const MIN_WPM = 60, MAX_WPM = 900;
  let opening = false;    // suppresses position writes while a book is loading

  /* Exponential so the slow end — where reading actually happens — gets
     most of the slider's travel. The old linear-ish curve spent three
     quarters of the range on speeds nobody can read. */
  function pxPerSec() {
    const wpmSet = +speed.value;
    const t = Math.log(wpmSet / MIN_WPM) / Math.log(MAX_WPM / MIN_WPM);
    // The slider sets words per minute, and pixels are worked out from how
    // dense the text is right now. Changing the text size therefore keeps
    // the reading pace instead of quietly slowing or speeding it.
    const wpp = book ? m().wordsPerPx : 0;
    if (wpp > 0 && isFinite(wpp)) {
      const wpm = wpmSet;
      return Math.max(1, Math.min(600, wpm / 60 / wpp));
    }
    return MIN_PPS * Math.pow(MAX_PPS / MIN_PPS, t);
  }

  let metrics = null;
  function m() {
    if (metrics) return metrics;
    const cs = getComputedStyle(reader);
    const padT = parseFloat(cs.paddingTop) || 0;
    const padB = parseFloat(cs.paddingBottom) || 0;
    const lineH = parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.75;
    const textH = Math.max(1, reader.scrollHeight - padT - padB);
    const words = book && book.words ? book.words : (content.textContent.match(/\S+/g) || []).length;
    metrics = { padT, lineH, textH, words, wordsPerPx: words / textH };
    return metrics;
  }
  const invalidate = () => { metrics = null; };
  const maxScroll = () => Math.max(0, reader.scrollHeight - reader.clientHeight);

  /* Finish when the last line reaches mid-screen rather than when the tail
     padding has scrolled past, so a run does not end on blank space. */
  function endScroll() {
    const c = m();
    return Math.max(0, Math.min(maxScroll(), c.padT + c.textH - reader.clientHeight * 0.5));
  }

  /* ---- position anchoring ----
     Positions are stored as a block index plus a fraction of that block,
     not a pixel offset. Pixels stop meaning anything the moment the text
     size, the window, or the device orientation changes — this survives
     all three, and is what makes resume land on the right sentence. */
  /* Many EPUBs wrap a whole chapter in one div. Anchoring to that wrapper
     means "43% through the chapter"; stepping inside it means a paragraph. */
  const WRAP = new Set(['DIV', 'SECTION', 'ARTICLE', 'MAIN', 'HEADER', 'FOOTER', 'ASIDE', 'NAV']);
  const BLOCKISH = new Set(['P', 'DIV', 'SECTION', 'ARTICLE', 'MAIN', 'HEADER', 'FOOTER', 'ASIDE', 'NAV', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
    'UL', 'OL', 'DL', 'BLOCKQUOTE', 'TABLE', 'PRE', 'FIGURE', 'HR']);
  function collectBlocks(el, out) {
    for (const child of el.children) {
      if (WRAP.has(child.tagName)) {
        let bare = false, inner = false;
        for (const n of child.childNodes) {
          if (n.nodeType === 3 && n.nodeValue.trim()) { bare = true; break; }
          if (n.nodeType === 1 && BLOCKISH.has(n.tagName)) inner = true;
        }
        if (!bare && inner) { collectBlocks(child, out); continue; }
      }
      out.push(child);
    }
  }
  function blockTop(el) { return el.offsetTop; }
  function anchorAt(scrollTop) {
    if (!blocks.length) return { b: 0, f: 0 };
    let lo = 0, hi = blocks.length - 1, idx = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (blockTop(blocks[mid]) <= scrollTop) { idx = mid; lo = mid + 1; } else hi = mid - 1;
    }
    const el = blocks[idx];
    const h = el.offsetHeight || 1;
    return { b: idx, f: Math.max(0, Math.min(1, (scrollTop - blockTop(el)) / h)) };
  }
  function anchorToScroll(a) {
    if (!a || !blocks.length) return 0;
    const el = blocks[Math.max(0, Math.min(blocks.length - 1, a.b | 0))];
    return blockTop(el) + (a.f || 0) * (el.offsetHeight || 0);
  }

  /* The reader's place is tracked continuously rather than captured when a
     reflow is already under way. Resize events arrive *after* the browser
     has relaid out, so measuring then reads the new layout and locks in
     whatever paragraph happens to sit at the old pixel offset. The layout
     key marks when scrollTop stops meaning what it meant, and readings
     taken after that point are ignored until the position is restored. */
  let lastAnchor = { b: 0, f: 0 };
  let anchorLayout = '';
  const layoutKey = () => reader.clientWidth + 'x' + reader.clientHeight + '@' + font.value;
  const syncLayout = () => { anchorLayout = layoutKey(); };
  function noteAnchor() {
    if (opening || layoutKey() !== anchorLayout) return;
    lastAnchor = anchorAt(reader.scrollTop);
  }
  function reflowTo(a) {
    invalidate();
    syncLayout();
    seekTo(anchorToScroll(a));
  }

  /* ---- status ---- */
  function fmt(sec) {
    if (!isFinite(sec) || sec <= 0) return '0:00';
    const s = Math.round(sec), h = Math.floor(s / 3600);
    const mm = Math.floor((s % 3600) / 60), ss = s % 60;
    return h ? h + ':' + String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0')
             : mm + ':' + String(ss).padStart(2, '0');
  }
  function currentChapter() {
    let idx = 0;
    for (let i = 0; i < sections.length; i++) {
      if (sections[i].offsetTop <= reader.scrollTop + 4) idx = i; else break;
    }
    return idx;
  }
  let flashTimer = null;
  function flash(msg) {
    flashMsg = msg;
    flashUntil = performance.now() + 1600;
    render();
    clearTimeout(flashTimer);
    flashTimer = setTimeout(render, 1650); // put the real status back
  }

  function renderFoot(p, end) {
    const pct = (p * 100).toFixed(1).replace(/\.0$/, '');
    footFill.style.width = (p * 100).toFixed(2) + '%';
    if (!book) { footLeft.textContent = ''; footRight.textContent = ''; return; }
    const n = book.chapters.length, i = currentChapter();
    // Time left in this chapter as well as the book: the useful number at 1am.
    const next = sections[i + 1] ? Math.min(end, (sections[i + 1].firstElementChild || sections[i + 1]).offsetTop) : end;
    const pps = pxPerSec();
    const chLeft = Math.max(0, next - reader.scrollTop) / pps;
    footLeft.textContent = n > 1 ? 'Ch ' + (i + 1) + ' of ' + n + ' · ' + fmt(chLeft) + ' left' : '';
    footRight.textContent = pct + '% · ' + fmt(Math.max(0, end - reader.scrollTop) / pps) + ' left'
      + ((scrolling || speaking) && isFinite(sleepAt) ? ' · ☾ ' + fmt(Math.max(0, sleepAt - performance.now()) / 1000) : '');
  }

  function render() {
    const end = endScroll();
    const p = end > 0 ? Math.min(1, Math.max(0, reader.scrollTop / end)) : 0;
    fill.style.width = (p * 100).toFixed(2) + '%';
    renderFoot(p, end);

    const pps = pxPerSec();
    const wpm = Math.round(pps * m().wordsPerPx * 60);
    speedVal.textContent = wpm > 0 && isFinite(wpm) ? String(wpm) : Math.round(pps) + ' px/s';
    fontVal.textContent = font.value + 'px';

    if (flashUntil > performance.now()) { statusEl.classList.remove('quiet'); statusEl.textContent = flashMsg; return; }
    statusEl.classList.add('quiet');
    const left = Math.max(0, end - reader.scrollTop) / pps;
    const ch = book && book.chapters[currentChapter()];
    const name = ch ? ch.title : '';
    statusEl.textContent = (name ? name + '  ·  ' : '') + Math.round(p * 100) + '%  ·  ' + fmt(left) + ' left'
      + ((scrolling || speaking) && isFinite(sleepAt) ? '  ·  sleep ' + fmt(Math.max(0, sleepAt - performance.now()) / 1000) : '')
      + (scrolling && hz ? '  ·  ' + hz + ' Hz' : '');
  }

  /* ---- scroll loop ---- */
  function step(t) {
    if (!scrolling) return;
    if (!lastT) lastT = t;
    // Measure the frame rate the browser actually gives us (shown in the status line).
    if (lastT !== t) { const inst = 1000 / (t - lastT); hzAvg = hzAvg ? hzAvg * 0.95 + inst * 0.05 : inst; hz = Math.round(hzAvg / 10) * 10 || Math.round(hzAvg); }
    const dt = Math.min(MAX_DT, (t - lastT) / 1000); // a backgrounded tab must not fast-forward
    lastT = t;

    if (coast) {
      // A finger or wheel has the page: stand aside until it lets go and
      // any momentum has died, then carry on from wherever it left off.
      setFrac(0);
      if (held || t - lastUserScroll < 140) { rafId = requestAnimationFrame(step); return; }
      coast = false; pos = applied = reader.scrollTop; noteAnchor();
    }
    if (Math.abs(reader.scrollTop - applied) > 1.5) pos = reader.scrollTop; // finger scroll wins
    // Ease in on Play, ease out on Pause and on the sleep timer.
    if (ramp !== rampTarget) {
      ramp = rampTarget > ramp ? Math.min(rampTarget, ramp + dt / RAMP_UP) : Math.max(rampTarget, ramp - dt / rampDown);
      if (ramp <= 0 && rampTarget <= 0) { stop(); if (sleepNote) { flash(sleepNote); sleepNote = ''; } return; }
    }
    pos += pxPerSec() * dt * ramp;
    countReading(dt * ramp);
    if (rampTarget > 0 && performance.now() > sleepAt) {
      sleepNote = 'Sleep timer: paused after 15 minutes';
      softStop(4);
    }

    const end = endScroll();
    if (pos >= end) {
      reader.scrollTop = end; applied = reader.scrollTop; setFrac(0);
      render(); stop(); saveProgress();
      if (caps.archive && book && book.driveId && !archivedIds().has(book.driveId)) {
        finished = { driveId: book.driveId, title: book.title };
        $('doneNote').textContent = 'You reached the end of “' + book.title + '”. Move it to the Archive folder on Drive? It stays readable from the Archive tab.';
        openSheet(doneSheet);
      }
      return;
    }
    // Browsers round scrollTop to whole pixels (Safari does, on iPhone), so at
    // reading speeds a pure scrollTop scroll moves in 1 px steps with frames of
    // no movement in between: a visible stutter. The whole pixels go to
    // scrollTop and the fraction left over goes to a GPU transform, so the
    // text moves a little every frame.
    reader.scrollTop = Math.floor(pos);
    applied = reader.scrollTop;
    setFrac(pos - applied);

    if (t - lastStatusT > 250) { lastStatusT = t; noteAnchor(); render(); saveProgressSoon(); }
    rafId = requestAnimationFrame(step);
  }

  /* Gentle start and stop, and the 15-minute sleep timer. Any real touch
     on the page or the controls restarts the 15 minutes. */
  const RAMP_UP = 0.6, SLEEP_MS = 15 * 60 * 1000;
  let ramp = 1, rampTarget = 1, rampDown = 0.45, sleepAt = Infinity, sleepNote = '';
  const wakeUp = () => { if (scrolling || speaking) sleepAt = performance.now() + SLEEP_MS; };
  function softStop(seconds) {
    if (!scrolling) return;
    rampDown = seconds; rampTarget = 0;
    playBtn.textContent = '▶ Play';
  }

  function play() {
    if (speaking) stopSpeak();
    if (!book) return;
    if (reader.scrollTop >= endScroll() - 0.5) { flash('End of the book. Drag the bar at the top to go back.'); return; }
    scrolling = true; lastT = 0; held = false; coast = false;
    ramp = 0; rampTarget = 1; sleepAt = performance.now() + SLEEP_MS;
    pos = applied = reader.scrollTop;
    playBtn.textContent = '❚❚ Pause';
    acquireWake();
    armChrome();
    rafId = requestAnimationFrame(step);
  }
  let fracShown = 0, hz = 0, hzAvg = 0;
  function setFrac(f) {
    f = f > 0 && f < 2 ? Math.round(f * 100) / 100 : 0;
    if (f === fracShown) return;
    fracShown = f;
    content.style.transform = f ? 'translate3d(0,' + (-f) + 'px,0)' : '';
  }

  function stop() {
    scrolling = false; ramp = 1; rampTarget = 1; sleepAt = Infinity;
    flushStats();
    setFrac(0);
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    playBtn.textContent = '▶ Play';
    releaseWake();
    clearTimeout(chromeTimer);
    app.classList.remove('immersive');   // pausing always brings the controls back
    saveProgress();
    flushSync();                          // a pause is the moment the other phone should know
  }
  const toggle = () => {
    if (speaking) { stopSpeak(); return; }
    if (!scrolling) { play(); return; }
    if (rampTarget > 0) softStop(0.45);
    else { rampTarget = 1; playBtn.textContent = '❚❚ Pause'; sleepAt = performance.now() + SLEEP_MS; }   // tapped again while easing out: carry on
  };

  function seekTo(px) {
    reader.scrollTop = Math.max(0, Math.min(maxScroll(), px || 0));
    pos = applied = reader.scrollTop;
    noteAnchor();
    render();
    saveProgressSoon();
  }
  const nudge = (lines) => seekTo(reader.scrollTop + lines * m().lineH);

  /* ---- immersive chrome ----
     The controls only get out of the way while the text is actually
     moving; pausing always brings them back, so there is never a tap
     whose only effect is to reveal a toolbar. */
  const CHROME_DELAY = 2600;
  let chromeTimer = null;
  function sheetOpen() {
    return !!app.querySelector('.sheet:not(.hidden)');
  }
  function armChrome() {
    clearTimeout(chromeTimer);
    if (!scrolling) return;
    chromeTimer = setTimeout(() => {
      if (scrolling && !sheetOpen() && book) app.classList.add('immersive');
    }, CHROME_DELAY);
  }
  function showChrome() {
    wakeUp();
    app.classList.remove('immersive');
    armChrome();
  }

  /* ---- save a copy ----
     Serialises the running page back out as a standalone file, so the
     hosted version can hand you an offline one. Your books are not in
     the file — they live in this browser's storage — so the copy starts
     with an empty library. */
  function saveCopy() {
    try {
      const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = 'autoscroll-reader.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      showNotice('Saved. Open that file in any browser to read offline — it starts with an empty library, since your books live in this browser.');
    } catch (_) {
      showNotice('This browser would not let the page save a copy. Use your browser\'s own Save Page As instead.');
    }
  }

  /* ---- full screen ---- */
  // Quiet version for the double/triple tap: no warning where the browser
  // has no full screen (iPhone) — the bar still hides, which is the point.
  function setFullscreen(want) {
    const el = document.documentElement;
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (want === on) return;
    try {
      const fn = want ? (el.requestFullscreen || el.webkitRequestFullscreen)
                      : (document.exitFullscreen || document.webkitExitFullscreen);
      if (!fn || (want && !(document.fullscreenEnabled || document.webkitFullscreenEnabled))) return;
      const r = fn.call(want ? el : document);
      if (r && r.catch) r.catch(() => {});
    } catch (_) {}
  }
  function toggleFullscreen() {
    const el = document.documentElement;
    const on = document.fullscreenElement || document.webkitFullscreenElement;
    // iPhone browsers have no full-screen mode for pages at all; only a
    // Home Screen web app hides the bars there.
    const iOS = /iPhone|iPod/.test(navigator.userAgent) || (/Mac/.test(navigator.platform) && navigator.maxTouchPoints > 1 && !/iPad/.test(navigator.userAgent) && screen.width < 500);
    const refused = () => flash(iOS ? 'iPhone blocks full screen · use Add to Home Screen' : 'Full screen is blocked in this browser');
    try {
      const fn = on ? (document.exitFullscreen || document.webkitExitFullscreen)
                    : (el.requestFullscreen || el.webkitRequestFullscreen);
      if (!fn || (!on && !(document.fullscreenEnabled || document.webkitFullscreenEnabled))) { refused(); return; }
      const r = fn.call(on ? document : el);
      if (r && r.catch) r.catch(refused);
    } catch (_) { refused(); }
  }

  /* ---- installable to the home screen ----
     Injected at runtime rather than declared up front: when this page is
     published, the surrounding document head is not ours to author. */
  let themeMeta = null;
  (function install() {
    try {
      const add = (name, content) => {
        const m = document.createElement('meta');
        m.name = name; m.content = content;
        document.head.appendChild(m);
        return m;
      };
      add('mobile-web-app-capable', 'yes');
      add('apple-mobile-web-app-capable', 'yes');
      add('apple-mobile-web-app-title', 'Reader');
      add('apple-mobile-web-app-status-bar-style', 'black-translucent');
      themeMeta = add('theme-color', '#14110f');

      const manifest = {
        name: 'Autoscroll Reader', short_name: 'Reader', display: 'fullscreen',
        background_color: '#14110f', theme_color: '#14110f', start_url: '.'
      };
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
      document.head.appendChild(link);
    } catch (_) { /* best effort — the page works without it */ }
  })();

  /* ---- keeping the screen on while reading ---- */
  async function acquireWake() {
    try {
      wantWake = true;
      if ('wakeLock' in navigator && !wakeLock) {
        const l = await navigator.wakeLock.request('screen');
        // Paused (or locked twice) while the request was in flight: hand it back.
        if (!wantWake || wakeLock) { l.release().catch(() => {}); return; }
        wakeLock = l;
        l.addEventListener('release', () => { if (wakeLock === l) wakeLock = null; });
      }
    } catch (_) { /* unsupported, denied, or insecure context */ }
  }
  function releaseWake() { wantWake = false; if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }

  /* Reading time is tallied per day under a key of this device's own in the
     shared progress file, so devices never overwrite each other's minutes. */
  const DEVICE = (() => {
    try { let d = localStorage.getItem('autoscroll-reader/device'); if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem('autoscroll-reader/device', d); } return d; }
    catch (_) { return 'x' + Math.random().toString(36).slice(2, 8); }
  })();
  const STATKEY = 'stats:' + DEVICE;
  let statPending = 0, statLastFlush = 0;
  const dayKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  function countReading(sec) {
    if (!(sec > 0)) return;
    statPending += sec;
    const now = performance.now();
    if (now - statLastFlush > 30000) flushStats();
  }
  function flushStats() {
    statLastFlush = performance.now();
    if (statPending < 1) return;
    const rec = progMap[STATKEY] && progMap[STATKEY].days ? progMap[STATKEY] : { days: {} };
    const k = dayKey();
    rec.days[k] = Math.round((rec.days[k] || 0) + statPending);
    rec.t = Date.now();
    statPending = 0;
    writeProg(STATKEY, rec);
    queueSync(STATKEY, rec);
  }
  function allDays() {
    const sum = {};
    for (const key in progMap) {
      if (!key.startsWith('stats:') || !progMap[key] || !progMap[key].days) continue;
      const days = progMap[key].days;
      for (const d in days) sum[d] = (sum[d] || 0) + days[d];
    }
    return sum;
  }

  /* =====================================================================
     Read aloud: the phone's own voice reads paragraph by paragraph from
     where you are, the page follows the voice, and the paragraph being
     read is highlighted. Long paragraphs are fed a few sentences at a time,
     because some browsers stall on very long utterances.
     ===================================================================== */
  let speaking = false, speakIdx = 0, speakTimer = null;
  const synth = window.speechSynthesis;
  function chunksOf(text) {
    const parts = text.match(/[^.!?…]+[.!?…]+["'”’)]*\s*|[^.!?…]+$/g) || [text];
    const out = []; let cur = '';
    for (const p of parts) { if ((cur + p).length > 220 && cur) { out.push(cur); cur = p; } else cur += p; }
    if (cur.trim()) out.push(cur);
    return out;
  }
  function startSpeak() {
    if (!book || !synth) { flash('This browser cannot read aloud'); return; }
    if (scrolling) stop();
    speaking = true;
    $('ttsBtn').classList.add('on');
    playBtn.textContent = '❚❚ Pause';
    sleepAt = performance.now() + SLEEP_MS;
    acquireWake();
    speakIdx = anchorAt(reader.scrollTop + reader.clientHeight * 0.2).b;
    try { synth.cancel(); } catch (_) {}
    speakBlock();
    clearInterval(speakTimer);
    speakTimer = setInterval(() => {
      countReading(1);
      if (performance.now() > sleepAt) { stopSpeak(); flash('Sleep timer: stopped reading after 15 minutes'); }
      render();
    }, 1000);
  }
  function speakBlock() {
    if (!speaking) return;
    while (speakIdx < blocks.length && !blocks[speakIdx].textContent.trim()) speakIdx++;
    if (speakIdx >= blocks.length) { stopSpeak(); return; }
    const el = blocks[speakIdx];
    for (const x of content.querySelectorAll('.speaking')) x.classList.remove('speaking');
    el.classList.add('speaking');
    const target = Math.max(0, el.offsetTop - reader.clientHeight * 0.22);
    try { reader.scrollTo({ top: target, behavior: 'smooth' }); } catch (_) { reader.scrollTop = target; }
    const chunks = chunksOf(el.textContent.replace(/\s+/g, ' ').trim());
    let i = 0;
    const next = () => {
      if (!speaking) return;
      if (i >= chunks.length) { speakIdx++; speakBlock(); return; }
      const u = new SpeechSynthesisUtterance(chunks[i++]);
      u.rate = 1;
      const v = pickVoice(); if (v) u.voice = v;
      u.onend = next;
      u.onerror = (e) => { if (speaking && e.error !== 'interrupted' && e.error !== 'canceled') next(); };
      try { synth.speak(u); } catch (_) { stopSpeak(); flash('This browser cannot read aloud'); }
    };
    next();
  }
  let chosenVoice = null;
  function pickVoice() {
    if (chosenVoice) return chosenVoice;
    const vs = (synth.getVoices && synth.getVoices()) || [];
    const lang = (document.documentElement.lang || 'en').slice(0, 2);
    // Prefer the better-sounding voices when the phone has them.
    chosenVoice = vs.find((v) => v.lang && v.lang.startsWith(lang) && /enhanced|premium|natural|neural/i.test(v.name))
      || vs.find((v) => v.lang && v.lang.startsWith('en') && v.default)
      || vs.find((v) => v.lang && v.lang.startsWith('en')) || null;
    return chosenVoice;
  }
  function stopSpeak() {
    if (!speaking) return;
    speaking = false;
    clearInterval(speakTimer);
    try { synth.cancel(); } catch (_) {}
    $('ttsBtn').classList.remove('on');
    for (const x of content.querySelectorAll('.speaking')) x.classList.remove('speaking');
    playBtn.textContent = '▶ Play';
    releaseWake();
    sleepAt = Infinity;
    flushStats();
    saveProgress(); flushSync();
  }

  /* =====================================================================
     Opening books
     ===================================================================== */
  async function addEpubFile(file) {
    return addEpubBuffer(await file.arrayBuffer(), file.name, file.size, null);
  }
  async function addEpubBuffer(buf, fileName, size, driveId) {
    const parsed = await parseEpub(buf, fileName.replace(/\.epub$/i, ''));
    const id = bookId(parsed.title, parsed.author, size);
    const existing = await getBook(id);
    const rec = {
      id, kind: 'epub',
      title: parsed.title, author: parsed.author, cover: parsed.cover,
      words: parsed.words,
      chapters: parsed.chapters.map((c) => ({ title: c.title })),
      progress: progMap[id] || (existing && existing.progress) || null,     // re-adding keeps your place
      added: (existing && existing.added) || Date.now(),
      opened: Date.now(),
      fileName, size,
      driveId: driveId || (existing && existing.driveId) || null
    };
    await putText({ id, chapters: parsed.chapters });
    await putBook(rec);
    return rec;
  }

  async function addPastedText(title, text, drive) {
    const words = (text.match(/\S+/g) || []).length;
    const id = bookId(title, 'pasted', text.length);
    const html = '<div class="plain"></div>';
    const holder = document.createElement('div');
    holder.innerHTML = html;
    holder.firstChild.textContent = text;
    const rec = {
      id, kind: 'text', title, author: '', cover: null, words,
      chapters: [{ title: title }], progress: progMap[id] || null, added: Date.now(), opened: Date.now(),
      driveId: drive ? drive.id : null, fileName: drive ? drive.name : null, size: drive ? drive.size : null
    };
    await putText({ id, chapters: [{ title: title, html: holder.innerHTML }] });
    await putBook(rec);
    return rec;
  }

  async function openBook(rec) {
    wantOpen = rec && rec.driveId ? rec.driveId : null;
    showBusy('Opening ' + rec.title + '…');
    stop();
    // Read the saved place up front: everything below moves the reader
    // around, and a stray write would overwrite the place we came to resume.
    // Another phone may have read further since this one last looked.
    if (gas) {
      try { mergeRemote(await withTimeout(gasCall('getProgress'), 2500)); } catch (_) { /* offline: use what is here */ }
      if (progMap[rec.id]) rec.progress = progMap[rec.id];
    }
    const saved = rec.progress;
    const resume = saved && saved.v === 2 ? { b: saved.b, f: saved.f } : null;
    opening = true;
    try {
      const stored = await getText(rec.id);
      if (!stored) throw new Err('That book is in your library but its text is missing. Open the EPUB again to restore it.');

      book = rec;
      content.textContent = '';
      reader.scrollTop = 0;
      const frag = document.createDocumentFragment();
      sections = [];
      stored.chapters.forEach((ch, i) => {
        const sec = document.createElement('section');
        sec.className = 'chapter';
        sec.innerHTML = ch.html;
        const first = sec.firstElementChild;
        if (first && /^H[1-6]$/.test(first.tagName)) first.classList.add('chapter-start');
        frag.appendChild(sec);
        sections.push(sec);
      });
      content.appendChild(frag);

      // Flat list of top-level blocks, used for anchoring positions.
      blocks = [];
      for (const sec of sections) {
        const n = blocks.length; collectBlocks(sec, blocks);
        if (blocks.length === n) blocks.push(sec);
      }
      invalidate();

      libraryView.classList.add('hidden');
      readerView.classList.remove('hidden');
      buildToc();

      // Two frames: one for layout, one so offsetTop is settled before we seek.
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      opening = false;
      reflowTo(resume || { b: 0, f: 0 });
      // Places saved before blocks were counted paragraph by paragraph:
      // use the stored fraction of the book, which is close rather than exact.
      if (!resume && saved && saved.p > 0) seekTo(saved.p * endScroll());
      render();
      settleImages();
      rec.opened = Date.now();
      putBook(rec);
    } catch (e) {
      opening = false;
      toLibrary();
      showNotice(e.friendly ? e.message : 'Something went wrong opening that book.');
    } finally {
      hideBusy();
    }
  }

  /* An image has no height until it decodes, so every paragraph after it
     shifts down the moment it lands. Hold whatever is on screen *now* —
     re-applying the position the book opened at would drag the reader back
     to the start when a lazily-loaded image further in finally arrives. */
  function settleImages() {
    const imgs = Array.from(content.querySelectorAll('img')).filter((i) => !i.complete);
    if (!imgs.length) return;
    const again = () => { if (!scrolling && !opening) reflowTo(lastAnchor); };
    for (const img of imgs) {
      img.addEventListener('load', again, { once: true });
      img.addEventListener('error', again, { once: true });
    }
  }

  function toLibrary() {
    stopSpeak();
    setTimeout(() => { if (!book && gas) refreshDrive(); }, 50);
    stop();
    clearTimeout(chromeTimer);
    app.classList.remove('immersive', 'nobar');
    setEditing(false);
    if (book) saveProgress();
    book = null; blocks = []; sections = [];
    content.textContent = '';
    readerView.classList.add('hidden');
    libraryView.classList.remove('hidden');
    renderLibrary();
  }

  let progressTimer = null;
  function saveProgress() {
    if (!book || !blocks.length || opening) return;
    noteAnchor();
    const end = endScroll();
    book.progress = {
      v: 2, b: lastAnchor.b, f: lastAnchor.f,
      p: end > 0 ? Math.min(1, reader.scrollTop / end) : 0,
      t: Date.now(),
      d: book.driveId || null
    };
    if (!writeProg(book.id, book.progress)) putBook(book).catch(() => {});

          // Drive names get tidied ("Title - Author"), so match on the exact byte size, which
          // two different EPUBs practically never share; the name is a second chance.
          const already = driveFiles.find((d) => d.kind === 'epub' && d.size === f.size)
            || driveFiles.find((d) => cleanName(d.name) === cleanName(f.name) && Math.abs(d.size - f.size) < 64);

  /* =====================================================================

     file simply has no Drive section. Drive is the master copy; the phone
     keeps its own parsed copy so reading never waits on the network.
     ===================================================================== */
  /* Two homes, one page. Served by Apps Script, it talks to Drive through
     google.script.run. Installed from the offline site, it talks to the same
     Code.gs through its web address with a private key, set once by opening
     the setup link (…#key=…&api=…). With no key, or no internet, it is a
     purely local reader. */

    let cfg = {};
    try { cfg = JSON.parse(localStorage.getItem(API_STORE) || '{}') || {}; } catch (_) {}
    try {
      const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
      if (h.get('key') && h.get('api')) {
        cfg = { key: h.get('key'), url: h.get('api') };
        localStorage.setItem(API_STORE, JSON.stringify(cfg));
        history.replaceState(null, '', location.pathname + location.search);   // keep the key out of the address bar
      }

  let driveFiles = (() => { try { return JSON.parse(localStorage.getItem('autoscroll-reader/drive-list') || '[]') || []; } catch (_) { return []; } })();

  function gasCall(fn, ...args) {

  let syncing = false;

      const added = hadList ? driveFiles.filter((d) => !before.has(d.id)).length : 0;
      const gone = hadList ? [...before].filter((id) => !driveFiles.some((d) => d.id === id)).length : 0;
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      driveState.textContent = added ? added + ' new' : 'Synced ' + time;
      if (manual === true) {
        showNotice(added || gone
          ? 'Drive synced: ' + [added && added + ' new', gone && gone + ' removed'].filter(Boolean).join(', ') + '.'
          : 'Drive synced. No new books.');
      }
    }
    catch (e) {
      if (!navigator.onLine) driveState.textContent = 'Offline';
      else { driveState.textContent = 'Drive unreachable'; if (manual === true) showNotice('Could not reach Drive: ' + gasMessage(e)); }
    }
    finally { syncing = false; btn.textContent = '↻ Sync Drive'; btn.disabled = false; }
    renderLibrary();
  }

  function localFor(d, books) {
    return books.find((b) => b.driveId === d.id || (b.fileName === d.name && b.size === d.size));
  }

  function makeDriveCard(d, pr) {
    const card = document.createElement('button');
    card.type = 'button'; card.className = 'card remote';
    card.dataset.driveId = d.id;
    const meta = infoFor(d.id);
    const title = meta.ti || cleanName(d.name);
    const cover = coverEl({ title, author: '', kind: d.kind === 'text' ? 'text' : 'epub', driveId: d.id });
    const badge = document.createElement('span'); badge.className = 'cloud'; badge.textContent = '☁';
    cover.appendChild(badge);
    const t = document.createElement('div'); t.className = 'card-title'; t.textContent = title;
    const pct = pr ? Math.round((pr.p || 0) * 100) : 0;
    const a = document.createElement('div'); a.className = 'card-author';
    a.textContent = meta.au || (pct > 0 ? 'Read on another device' : 'Not on this device yet');
    const l = document.createElement('div'); l.className = 'card-pct';
    l.textContent = pct > 0 ? pct + '% read' : '↓ ' + sizeLabel(d.size);
    card.append(cover, t, a, l);
    const meter = document.createElement('div'); meter.className = 'card-meter';
    const bar = document.createElement('i'); bar.style.width = pct + '%'; meter.appendChild(bar);
    if (!pct) meter.style.visibility = 'hidden';
    card.appendChild(meter);
    card.addEventListener('click', () => { if (!editing) fetchFromDrive(d); });
    if (dlNow.has(d.id)) requestAnimationFrame(() => paintDl(d.id));
    card.appendChild(delButton(() => askRemove({ title, remoteOnly: true, drive: d })));
    return card;
  }

  /* Downloaded in slices: one Apps Script reply has a size ceiling, and a
     large EPUB as base64 would hit it. */
  const SLICE = 4 * 1024 * 1024;
  /* Tapping a book that is not on this device: it downloads in the
     background while the library stays usable, its row shows the progress,
     and it opens by itself when ready (unless another book was tapped or
     opened since, in which case it just waits in the library). */
  const dlNow = new Map();      // drive id -> percent
  let wantOpen = null;
  function paintDl(id) {
    const pct = dlNow.get(id);
    for (const card of document.querySelectorAll('.card[data-drive-id="' + id + '"]')) {
      card.classList.toggle('loading', pct !== undefined);
      if (pct === undefined) continue;
      const l = card.querySelector('.card-pct'); if (l) l.textContent = pct >= 100 ? 'Opening…' : '↓ ' + pct + '%';
      const m = card.querySelector('.card-meter'); if (m) { m.style.visibility = 'visible'; m.firstChild.style.width = pct + '%'; }
    }
  }
  async function fetchInBackground(d) {
    wantOpen = d.id;
    if (dlNow.has(d.id) || (bulkRun && !bulkRun.stop)) {
      if (bulkRun) showNotice('Download all is running; this book will be ready as part of it.');
      return;
    }
    dlNow.set(d.id, 0); paintDl(d.id);
    try {
      const rec = await fetchFromDrive(d, {
        stopped: () => false,
        progress: (msg) => {
          const m = msg.match(/(\d+)%/);
          dlNow.set(d.id, m ? +m[1] : (/^Saving/.test(msg) ? 100 : dlNow.get(d.id)));
          paintDl(d.id);
        }
      });
      dlNow.delete(d.id);
      await renderLibrary();
      if (wantOpen === d.id && !book && !sheetOpen()) openBook(rec);
      else showNotice(shown(d) + ' is downloaded and ready.');
    } catch (e) {
      dlNow.delete(d.id);
      renderLibrary();
      showNotice(e && e.friendly ? shown(d) + ': ' + e.message : 'Could not download ' + shown(d) + ': ' + gasMessage(e));
    }
  }

  async function fetchFromDrive(d, bulk) {
    if (!bulk) return fetchInBackground(d);
    const busyOn = (msg) => bulk ? bulk.progress(msg) : showBusy(msg);
    const busyOff = () => { if (!bulk) hideBusy(); };
    if (d.kind === 'text') {
      try {
        busyOn('Downloading ' + shown(d) + '…');
        const text = await gasCall('getText', d.id);
        const rec = await addPastedText(d.name.replace(/\.txt$/i, ''), text, d);
        busyOff();
        if (bulk) return rec;
        await renderLibrary();
        openBook(rec);
      } catch (e) { busyOff(); if (bulk) throw e; showNotice('Could not download ' + shown(d) + ': ' + gasMessage(e)); }
      return;
    }
    const out = new Uint8Array(d.size);
    try {
      for (let at = 0; at < d.size; at += SLICE) {
        if (bulk && bulk.stopped()) throw new Error('stopped');
        busyOn('Downloading ' + shown(d) + ' · ' + Math.round(at / d.size * 100) + '%');
        const part = await gasCall('getBookPart', d.id, at, Math.min(SLICE, d.size - at));
        const bin = atob(part);
        for (let i = 0; i < bin.length; i++) out[at + i] = bin.charCodeAt(i);
      }
      busyOn((bulk ? 'Saving ' : 'Opening ') + shown(d) + '…');
      const rec = await addEpubBuffer(out.buffer, d.name, d.size, d.id);
      busyOff();
      if (bulk) return rec;
      await renderLibrary();
      openBook(rec);
    } catch (e) {
      busyOff();
      if (bulk) throw e;
      showNotice(e && e.friendly ? shown(d) + ': ' + e.message : 'Could not download ' + shown(d) + ': ' + gasMessage(e));
    }
  }

  /* ---- download every book for reading offline ----
     One at a time, so a phone on mobile data is not swamped. Books already
     here are skipped, archived ones too. Asks the browser to keep the
     storage, so it is less likely to clear the books to free space. */
  let bulkRun = null;
  function notHere() {
    return allBooks().then((books) => driveFiles.filter((d) => d.where !== 'archive' && !localFor(d, books || [])));
  }
  async function refreshDlBtn() {
    const btn = $('dlAllBtn');
    if (!gas || bulkRun) return;
    const left = await notHere().catch(() => []);
    btn.classList.toggle('hidden', !driveFiles.length);
    btn.textContent = left.length ? '⬇ Download all (' + left.length + ')' : '✓ All on this device';
    btn.disabled = !left.length;
  }
  async function downloadAll() {
    if (bulkRun) return;
    const todo = await notHere();
    if (!todo.length) { showNotice('Every book is already on this device.'); return; }
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (_) {}
    const total = todo.reduce((a, d) => a + (d.size || 0), 0);
    let doneBytes = 0, ok = 0;
    const failed = [];
    bulkRun = { stop: false };
    const strip = $('dlStrip'), text = $('dlText'), fill = $('dlFill'), btn = $('dlAllBtn');
    strip.classList.remove('hidden'); btn.disabled = true;
    for (let i = 0; i < todo.length; i++) {
      if (bulkRun.stop) break;
      const d = todo[i];
      const bulk = {
        stopped: () => bulkRun.stop,
        progress: (msg) => { text.textContent = (i + 1) + ' of ' + todo.length + ' · ' + msg.replace(/^Downloading /, ''); }
      };
      fill.style.width = (total ? doneBytes / total * 100 : i / todo.length * 100).toFixed(1) + '%';
      try { await fetchFromDrive(d, bulk); ok++; }
      catch (e) { if (!bulkRun.stop) failed.push(shown(d)); }
      doneBytes += d.size || 0;
      if ((i + 1) % 3 === 0) renderLibrary();   // ticks over to "Not started" as they land
    }
    const stopped = bulkRun.stop;
    bulkRun = null;
    fill.style.width = '100%';
    strip.classList.add('hidden');
    await renderLibrary();
    showNotice((stopped ? 'Stopped. ' : '') + ok + (ok === 1 ? ' book' : ' books') + ' saved on this device for reading offline.'
      + (failed.length ? ' Could not download: ' + failed.slice(0, 3).join(', ') + (failed.length > 3 ? ' and ' + (failed.length - 3) + ' more' : '') + '.' : ''));
  }

  /* ---- stats sheet ---- */
  const mins = (sec) => Math.round((sec || 0) / 60);
  const hm = (sec) => { const m = mins(sec); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm'; };
  function barsHtml(list) {
    const max = Math.max(600, ...list.map((x) => x.v));   // at least 10 min tall, so a few seconds look like a few seconds
    return '<div class="bars">' + list.map((x) =>
      '<div class="bar"><small>' + (x.v >= 60 ? mins(x.v) : '') + '</small><i class="' + (x.v < 60 ? 'zero' : '') + '" style="height:' +
      Math.max(2, Math.round(x.v / max * 92)) + 'px"></i><em>' + x.l + '</em></div>').join('') + '</div>';
  }
  function renderStats() {
    flushStats();
    const days = allDays();
    const today = new Date(); today.setHours(12, 0, 0, 0);
    const back = (n) => { const d = new Date(today); d.setDate(d.getDate() - n); return d; };
    const wk = []; let wkSum = 0;
    for (let i = 6; i >= 0; i--) { const d = back(i); const v = days[dayKey(d)] || 0; wkSum += v; wk.push({ v, l: d.toLocaleDateString([], { weekday: 'narrow' }) }); }
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const pre = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      let v = 0; for (const k in days) if (k.startsWith(pre)) v += days[k];
      months.push({ v, l: d.toLocaleDateString([], { month: 'short' }) });
    }
    let streak = 0; for (let i = 0; i < 400; i++) { if ((days[dayKey(back(i))] || 0) >= 60) streak++; else if (i > 0) break; }
    let monthSum = 0; for (let i = 0; i < 30; i++) monthSum += days[dayKey(back(i))] || 0;
    let finished = 0; for (const k in progMap) { const pr = progMap[k]; if (!k.includes(':') && pr && pr.p >= 0.99) finished++; }
    $('statsBody').innerHTML =
      '<div class="stat-tiles">' +
        '<div class="stat-tile"><b>' + hm(days[dayKey()] || 0) + '</b><span>Today</span></div>' +
        '<div class="stat-tile"><b>' + hm(wkSum) + '</b><span>Last 7 days</span></div>' +
        '<div class="stat-tile"><b>' + hm(monthSum) + '</b><span>Last 30 days</span></div>' +
        '<div class="stat-tile"><b>' + streak + (streak === 1 ? ' day' : ' days') + '</b><span>Streak (1 min+ a day)</span></div>' +
        '<div class="stat-tile"><b>' + finished + '</b><span>Books finished</span></div>' +
        '<div class="stat-tile"><b>' + hm(Object.values(days).reduce((a, b) => a + b, 0)) + '</b><span>All time</span></div>' +
      '</div>' +
      '<div class="stat-h"><span>This week</span><span>minutes</span></div>' + barsHtml(wk) +
      '<div class="stat-h"><span>Last 6 months</span><span>minutes</span></div>' + barsHtml(months) +
      '<div class="stats-note">Time counts while the page is scrolling or being read aloud, on every device signed in to this reader. Stats started on 13 Nov 2026.</div>';
  }

  /* ---- bookmarks: kept per book under "bm:<book>" in the shared progress
     file, stamped with the time, so the newest list wins on every device ---- */
  const bmKey = () => 'bm:' + book.id;
  const bmList = () => (book && progMap[bmKey()] && progMap[bmKey()].list) || [];
  function saveBookmarks(list) {
    const rec = { t: Date.now(), list };
    writeProg(bmKey(), rec); queueSync(bmKey(), rec); flushSync();
    renderBookmarks();
  }
  function renderBookmarks() {
    const box = $('bmList'); box.textContent = '';
    const list = bmList();
    if (!list.length) {
      const e = document.createElement('div'); e.className = 'bm-empty';
      e.textContent = 'None yet. “Bookmark this spot” saves the paragraph at the top of the screen.';
      box.appendChild(e); return;
    }
    list.slice().sort((a, b) => (a.b - b.b) || (a.f - b.f)).forEach((bm) => {
      const row = document.createElement('div'); row.className = 'bm-item';
      const go = document.createElement('button'); go.type = 'button'; go.className = 'toc-item';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = Math.round((bm.p || 0) * 100) + '%';
      const t = document.createElement('span'); t.className = 'snip'; t.textContent = bm.s || 'Bookmark';
      go.append(n, t);
      go.addEventListener('click', () => { closeSheet(tocSheet); reflowTo({ b: bm.b, f: bm.f }); });
      const del = document.createElement('button'); del.type = 'button'; del.className = 'bm-del'; del.textContent = '×';
      del.setAttribute('aria-label', 'Delete bookmark');
      del.addEventListener('click', () => saveBookmarks(bmList().filter((x) => x !== bm)));
      row.append(go, del);
      box.appendChild(row);
    });
  }
  function addBookmark() {
    if (!book) return;
    noteAnchor();
    const a = anchorAt(reader.scrollTop + 4);
    const el = blocks[a.b];
    const snip = el ? el.textContent.replace(/\s+/g, ' ').trim().slice(0, 140) : '';
    const end = endScroll();
    const list = bmList().filter((x) => x.b !== a.b);
    list.push({ b: a.b, f: a.f, s: snip, p: end > 0 ? Math.min(1, reader.scrollTop / end) : 0, c: Date.now() });
    saveBookmarks(list);
    flash('Bookmarked');
  }

  /* ---- contents sheet ---- */
  function buildToc() {
    tocList.textContent = '';
    if (!book) return;
    book.chapters.forEach((ch, i) => {
      const b = document.createElement('button');
      b.className = 'toc-item'; b.type = 'button';
      const n = document.createElement('span');
      n.className = 'n'; n.textContent = i + 1;
      const t = document.createElement('span');
      t.textContent = ch.title;
      b.append(n, t);
      b.addEventListener('click', () => {
        closeSheet(tocSheet);
        // Land on the chapter's first line, not on the gap above it —
        // stopping short leaves the previous chapter filling the screen.
        const sec = sections[i];
        if (sec) seekTo((sec.firstElementChild || sec).offsetTop);
      });
      tocList.appendChild(b);
    });
  }
  function openSheet(sheet) {
    clearTimeout(chromeTimer);
    app.classList.remove('immersive', 'nobar');
    if (sheet === tocSheet) {
      renderBookmarks();
      if (gas && book) gasCall('getProgress').then((m) => { if (mergeRemote(m)) renderBookmarks(); }).catch(() => {});
      const cur = currentChapter();
      Array.from(tocList.children).forEach((el, i) =>
        el.setAttribute('aria-current', i === cur ? 'true' : 'false'));
    }
    sheet.classList.remove('hidden');
  }
  const closeSheet = (sheet) => { sheet.classList.add('hidden'); armChrome(); };

  /* =====================================================================
     Wiring
     ===================================================================== */
  $('openBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { handleFiles(fileInput.files); fileInput.value = ''; });

  ['dragenter', 'dragover'].forEach((ev) => libraryView.addEventListener(ev, (e) => {
    e.preventDefault(); libraryView.classList.add('dragging');
  }));
  ['dragleave', 'drop'].forEach((ev) => libraryView.addEventListener(ev, (e) => {
    e.preventDefault(); libraryView.classList.remove('dragging');
  }));
  libraryView.addEventListener('drop', (e) => {
    if (e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
  });

  $('pasteBtn').addEventListener('click', () => { openSheet(pasteSheet); $('pasteText').focus(); });
  $('pasteClose').addEventListener('click', () => closeSheet(pasteSheet));
  $('pasteSave').addEventListener('click', async () => {
    const text = $('pasteText').value;
    if (!text.trim()) { $('pasteText').focus(); return; }
    const title = $('pasteTitle').value.trim() || text.trim().split('\n')[0].slice(0, 60) || 'Pasted text';
    const rec = await addPastedText(title, text);
    $('pasteText').value = ''; $('pasteTitle').value = '';
    if (gas) {
      gasCall('uploadText', title, text).then(async (up) => {
        rec.driveId = up.id; rec.fileName = up.name; rec.size = up.size;
        await putBook(rec);
        driveFiles.unshift(up);
      }).catch((e) => showNotice('Saved here, but could not copy “' + title + '” to Drive: ' + gasMessage(e)));
    }
    closeSheet(pasteSheet);
    await renderLibrary();
    openBook(rec);
  });

  playBtn.addEventListener('click', toggle);
  $('libBtn').addEventListener('click', toLibrary);
  $('backBtn').addEventListener('click', () => { nudge(-NUDGE); showChrome(); });
  $('fwdBtn').addEventListener('click', () => { nudge(NUDGE); showChrome(); });
  $('tocBtn').addEventListener('click', () => openSheet(tocSheet));
  editBtn.addEventListener('click', () => setEditing(!editing));
  fsBtn.addEventListener('click', toggleFullscreen);
  $('tocClose').addEventListener('click', () => closeSheet(tocSheet));
  $('themeBtn').addEventListener('click', () => openSheet(themeSheet));
  $('themeBtn2').addEventListener('click', () => openSheet(themeSheet));
  $('themeClose').addEventListener('click', () => closeSheet(themeSheet));
  $('removeCancel').addEventListener('click', () => { removing = null; closeSheet(removeSheet); });
  $('removeLocal').addEventListener('click', () => doRemove(false));
  $('statsBtn').addEventListener('click', async () => {
    renderStats(); openSheet(statsSheet);
    if (gas) { try { mergeRemote(await gasCall('getProgress')); renderStats(); } catch (_) {} }
  });
  $('statsClose').addEventListener('click', () => closeSheet(statsSheet));
  $('dlAllBtn').addEventListener('click', downloadAll);
  $('dlStop').addEventListener('click', () => { if (bulkRun) { bulkRun.stop = true; $('dlText').textContent = 'Stopping after this book…'; } });
  $('renameBtn').addEventListener('click', () => { $('renameRow').classList.remove('hidden'); $('renameBtn').classList.add('hidden'); $('renameInput').focus(); $('renameInput').select(); });
  $('renameSave').addEventListener('click', async () => {
    const t = removing; const name = $('renameInput').value.trim();
    if (!t || !name) return;

      const info = await gasCall('renameBook', did, name);
      const d = driveFiles.find((x) => x.id === did); if (d && info) d.name = info.name;
      const cur = infoFor(did); thumbs[did] = Object.assign({}, cur, { ti: name }); storeThumbs();
      pendingShare[did] = thumbs[did]; thumbsDirty = true; shareThumbs();
      if (t.book) { t.book.title = name; await putBook(t.book); }
      hideBusy(); showNotice('Renamed to “' + name + '”.');
    } catch (e) { hideBusy(); showNotice('Could not rename: ' + gasMessage(e)); }
